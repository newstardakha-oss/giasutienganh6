<title>Ngữ pháp Tiếng Anh 6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột vở ô li (max 760px), thanh trên dính, mỗi màn là một "trang vở" */
:root{
  --paper:#f5f7fb; --sheet:#ffffff; --ink:#18223f; --ink-soft:#56617f; --line:#dfe4ef;
  --grid:rgba(47,91,234,.06); --cobalt:#2f5bea; --cobalt-soft:#e7edfd; --marker:#ffe27a;
  --ok:#1a8a55; --ok-soft:#e3f5ec; --bad:#c8364b; --bad-soft:#fbe7ea;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f1424; --sheet:#171e33; --ink:#e7ebf7; --ink-soft:#9aa5c4; --line:#2a3452;
  --grid:rgba(120,150,255,.06); --cobalt:#8aa6ff; --cobalt-soft:#22305a; --marker:#6b5a12;
  --ok:#4fd08f; --ok-soft:#163a2a; --bad:#ff7b8d; --bad-soft:#41202a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#171e33; --ink:#e7ebf7; --ink-soft:#9aa5c4; --line:#2a3452;
  --grid:rgba(120,150,255,.06); --cobalt:#8aa6ff; --cobalt-soft:#22305a; --marker:#6b5a12;
  --ok:#4fd08f; --ok-soft:#163a2a; --bad:#ff7b8d; --bad-soft:#41202a; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand .six{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--cobalt);color:var(--sheet);font-size:1rem}
.top .spacer{flex:1}
.pill{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--cobalt-soft);color:var(--cobalt);border:0;white-space:nowrap}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.muted{color:var(--ink-soft)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--sheet);padding:10px 18px;border-radius:var(--r);font-weight:600}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--line)}
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ucard{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ucard:hover{border-color:var(--cobalt)}
.ucard .num{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;color:var(--cobalt)}
.ucard .t{font-weight:700}
.ucard .g{font-size:.82rem;color:var(--ink-soft)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--cobalt)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.gp{display:flex;flex-direction:column;gap:12px}
.gp>header{display:flex;flex-direction:column;gap:2px}
.sec h4{margin:6px 0 6px;font-size:.95rem;font-weight:700}
.blocks{display:flex;flex-direction:column;gap:6px}
.rule{padding-left:16px;position:relative}
.rule::before{content:"";position:absolute;left:3px;top:.68em;width:6px;height:6px;border-radius:2px;background:var(--cobalt)}
.formula{font-family:var(--f-mono);font-size:.86rem;background:var(--cobalt-soft);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
.example{display:flex;gap:8px;align-items:flex-start}
.example .en{font-weight:600}
.example .vi{font-size:.88rem;color:var(--ink-soft)}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--cobalt)}
.mistake{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.92rem;padding:8px 10px;border-radius:8px;border:1px dashed var(--line)}
.mistake .x{color:var(--bad);font-weight:700}.mistake .v{color:var(--ok);font-weight:700}
.mistake s{color:var(--ink-soft)}
.tip{background:linear-gradient(transparent 55%,var(--marker) 55%);font-weight:600;display:inline;padding:0 2px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.set:hover{border-color:var(--cobalt)}
.set .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set .ttl{font-weight:600}
.chip{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.stars{color:var(--cobalt);letter-spacing:1px;font-size:.8rem}
.score{font-family:var(--f-mono);font-size:.85rem;min-width:44px;text-align:right}
.score.done{color:var(--ok)}
/* player */
.player{display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;align-items:center;gap:10px}
.ptop .bar{flex:1}
.q{font-size:1.12rem;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--cobalt);margin:0 3px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:12px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--cobalt)}
.opt .k{font-family:var(--f-mono);color:var(--ink-soft);margin-right:6px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
input.inl,select.inl{border:0;border-bottom:2.5px solid var(--cobalt);background:var(--cobalt-soft);border-radius:6px 6px 0 0;padding:2px 8px;width:8.5em;max-width:100%;font-weight:600;line-height:1.4;vertical-align:baseline}
select.inl{width:auto}
input.inl.wide{width:12em}
input.inl.ok,select.inl.ok{border-color:var(--ok);background:var(--ok-soft)}
input.inl.bad,select.inl.bad{border-color:var(--bad);background:var(--bad-soft)}
textarea.full,input.full{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sheet);font-size:1rem}
textarea.full:focus,input.full:focus{border-color:var(--cobalt);outline:none}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:var(--r);border:1.5px dashed var(--line);background:var(--paper)}
.tray.answer{border-style:solid;border-color:var(--cobalt);background:var(--sheet)}
.tok{border:1.5px solid var(--ink);background:var(--sheet);border-radius:8px;padding:6px 12px;font-weight:600}
.tok.used{visibility:hidden}
.words{display:flex;flex-wrap:wrap;gap:6px;font-size:1.12rem}
.word{border:0;background:none;padding:4px 6px;border-radius:6px;border-bottom:2px dotted var(--line)}
.word:hover:not(:disabled){background:var(--cobalt-soft)}
.word.sel{background:var(--marker)}
.word.err{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cat{border:2px solid var(--ink);background:var(--sheet);border-radius:var(--r);padding:14px 10px;font-weight:700;font-family:var(--f-mono)}
.cat.ok{border-color:var(--ok);background:var(--ok-soft)}.cat.bad{border-color:var(--bad);background:var(--bad-soft)}
.cloze{line-height:2.3;font-size:1.02rem}
.cloze p{margin:0 0 6px}
.cloze .n{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-soft);vertical-align:super;margin-right:1px}
.instr{font-size:.88rem;background:var(--paper);border-left:3px solid var(--marker);padding:8px 12px;border-radius:0 8px 8px 0;white-space:pre-wrap}
.fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--ok)}.fb.bad .h{color:var(--bad)}
.fb .ans{font-weight:600}
.sum{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.review .r{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.92rem}
.empty{padding:28px;text-align:center;color:var(--ink-soft)}
.back{border:0;background:none;padding:0;color:var(--cobalt);font-weight:600}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
const DATA = {"meta":{"title":"Ngữ pháp Tiếng Anh 6 – Global Success","grade":6,"textbook":"Tiếng Anh 6 Global Success","version":"1.0.0","generatedAt":"2026-11-05","source":"Công phá ngữ pháp và bài tập Tiếng Anh 6 (Tập 1 & 2)","exerciseTypes":["mcq","gap","reorder","rewrite","error","classify","cloze"]},"units":[{"id":"u1","number":1,"title":"My New School","titleVi":"Trường mới của em","grammarPoints":[{"id":"u1-present-simple","title":"Present Simple","titleVi":"Thì hiện tại đơn","sections":[{"heading":"Cách dùng","blocks":[{"type":"rule","text":"Thói quen, hành động lặp lại"},{"type":"example","en":"I walk to school every day.","vi":"Tôi đi bộ đến trường mỗi ngày."},{"type":"rule","text":"Sự thật, chân lý"},{"type":"example","en":"Water boils at 100°C.","vi":"Nước sôi ở 100°C."},{"type":"rule","text":"Trạng thái, sở thích, cảm xúc"},{"type":"example","en":"Lan likes English.","vi":"Lan thích môn Tiếng Anh."},{"type":"rule","text":"Lịch trình cố định"},{"type":"example","en":"The first lesson starts at 7 a.m.","vi":"Tiết học đầu tiên bắt đầu lúc 7 giờ."}]},{"heading":"Động từ TO BE: am / is / are","blocks":[{"type":"formula","text":"(+) I am · He/She/It is · You/We/They are"},{"type":"formula","text":"(–) S + am not / isn't / aren't + ..."},{"type":"formula","text":"(?) Am/Is/Are + S + ...?  →  Yes, S + am/is/are. / No, S + am not/isn't/aren't."},{"type":"example","en":"My classroom is large.","vi":"Lớp học của tôi rộng."},{"type":"example","en":"Is your classroom large? – Yes, it is.","vi":"Lớp bạn có rộng không? – Có."}]},{"heading":"Động từ thường","blocks":[{"type":"formula","text":"(+) I/You/We/They + V · He/She/It + V-s/es"},{"type":"formula","text":"(–) S + don't / doesn't + V nguyên mẫu"},{"type":"formula","text":"(?) Do/Does + S + V nguyên mẫu?  →  Yes, S + do/does. / No, S + don't/doesn't."},{"type":"example","en":"Duy studies English every day.","vi":"Duy học tiếng Anh mỗi ngày."},{"type":"example","en":"Does Duy study English every day? – Yes, he does.","vi":"Duy có học tiếng Anh mỗi ngày không? – Có."}]},{"heading":"Dấu hiệu nhận biết","blocks":[{"type":"rule","text":"always, usually, often, sometimes, rarely/seldom, never"},{"type":"rule","text":"every day/week; on Mondays; once/twice a week; in the morning"},{"type":"mistake","wrong":"She doesn't goes to school by bus.","right":"She doesn't go to school by bus."},{"type":"tip","text":"Sau do/does/don't/doesn't, động từ chính luôn ở dạng nguyên mẫu."}]}]},{"id":"u1-s-es","title":"Adding -s / -es","titleVi":"Quy tắc thêm -s/-es và cách phát âm","sections":[{"heading":"Khi nào thêm đuôi?","blocks":[{"type":"rule","text":"Chỉ thêm -s/-es ở câu khẳng định khi chủ ngữ là He, She, It hoặc danh từ số ít."},{"type":"rule","text":"I/You/We/They hoặc danh từ số nhiều → dùng động từ nguyên mẫu."},{"type":"example","en":"Nam plays football. / They play football.","vi":"Nam chơi bóng đá. / Họ chơi bóng đá."}]},{"heading":"Quy tắc chính tả","blocks":[{"type":"formula","text":"Phần lớn động từ: V + s → reads, plays, likes"},{"type":"formula","text":"Tận cùng -s, -ss, -sh, -ch, -x, -z, -o: + es → watches, washes, fixes, goes, does"},{"type":"formula","text":"Phụ âm + y: y → i + es → study → studies, carry → carries"},{"type":"formula","text":"Nguyên âm + y: + s → play → plays, enjoy → enjoys"},{"type":"formula","text":"Đặc biệt: have → has"}]},{"heading":"Phát âm đuôi -s/-es","blocks":[{"type":"formula","text":"/s/ sau âm vô thanh /p, k, f, t, θ/ → stops, likes, laughs"},{"type":"formula","text":"/ɪz/ sau /s, z, ʃ, ʒ, tʃ, dʒ/ → watches, washes, closes"},{"type":"formula","text":"/z/ các trường hợp còn lại → plays, reads, comes"},{"type":"tip","text":"Cách phát âm phụ thuộc vào ÂM cuối, không phải CHỮ cái cuối."},{"type":"mistake","wrong":"He study English.","right":"He studies English."},{"type":"mistake","wrong":"Does she likes Maths?","right":"Does she like Maths?"}]}]},{"id":"u1-frequency","title":"Adverbs of Frequency","titleVi":"Trạng từ và cụm từ chỉ tần suất","sections":[{"heading":"Thang tần suất","blocks":[{"type":"formula","text":"always (100%) → usually → often → sometimes → rarely/seldom → never (0%)"},{"type":"example","en":"I usually do my homework after dinner.","vi":"Tôi thường làm bài tập sau bữa tối."}]},{"heading":"Vị trí trong câu","blocks":[{"type":"formula","text":"S + trạng từ tần suất + V thường → Lan often goes to the library."},{"type":"formula","text":"S + am/is/are + trạng từ tần suất → Nam is never late for school."},{"type":"formula","text":"Modal / don't / doesn't + trạng từ + V → They don't often go to the cinema."},{"type":"rule","text":"Cụm tần suất (every day, once a week, twice a month, on Mondays) thường đứng cuối câu."},{"type":"example","en":"We have English three times a week.","vi":"Chúng tôi học tiếng Anh ba lần một tuần."}]},{"heading":"Câu hỏi How often","blocks":[{"type":"formula","text":"How often + do/does + S + V?"},{"type":"example","en":"How often do you play badminton? – Twice a week.","vi":"Bạn chơi cầu lông bao lâu một lần? – Hai lần một tuần."},{"type":"mistake","wrong":"I don't never go to school late.","right":"I never go to school late."},{"type":"tip","text":"Never đã mang nghĩa phủ định, không dùng thêm don't/doesn't."}]}]}],"exerciseSets":[{"id":"u1-s1","type":"mcq","title":"Chọn đáp án đúng","level":1,"grammarPointId":"u1-present-simple","items":[{"id":"u1-s1-q1","prompt":"My new school ___ very big.","options":["am","is","are","be"],"answerIndex":1,"explanation":"\"My new school\" là danh từ số ít → is."},{"id":"u1-s1-q2","prompt":"Lan ___ English every day.","options":["study","studies","studying","studied"],"answerIndex":1,"explanation":"Lan = she, có \"every day\" → hiện tại đơn; study (phụ âm + y) → studies."},{"id":"u1-s1-q3","prompt":"We ___ to school at 7 a.m.","options":["goes","going","go","gone"],"answerIndex":2,"explanation":"Chủ ngữ We → động từ nguyên mẫu."},{"id":"u1-s1-q4","prompt":"He ___ his homework after school.","options":["do","does","doing","did"],"answerIndex":1,"explanation":"He → do thêm -es thành does."},{"id":"u1-s1-q5","prompt":"Nam ___ a new bicycle.","options":["have","having","has","had"],"answerIndex":2,"explanation":"have là trường hợp đặc biệt: He/She/It → has."},{"id":"u1-s1-q6","prompt":"Mai ___ to the school library every afternoon.","options":["go","gone","going","goes"],"answerIndex":3,"explanation":"Mai (số ít) + go → goes (tận cùng -o thêm -es)."},{"id":"u1-s1-q7","prompt":"The first lesson ___ at 7:15.","options":["start","starting","starts","started"],"answerIndex":2,"explanation":"Lịch trình cố định dùng hiện tại đơn; \"The first lesson\" số ít → starts."},{"id":"u1-s1-q8","prompt":"My brother and I ___ lunch at school.","options":["has","have","having","had"],"answerIndex":1,"explanation":"\"My brother and I\" = we (số nhiều) → have."}]},{"id":"u1-s2","type":"gap","title":"Điền am / is / are / am not / is not / are not","level":1,"grammarPointId":"u1-present-simple","items":[{"id":"u1-s2-q1","prompt":"I ___ a new student at this school.","blanks":[{"accept":["am"]}],"explanation":"Chủ ngữ I → am."},{"id":"u1-s2-q2","prompt":"My classroom ___ on the first floor.","blanks":[{"accept":["is"]}],"explanation":"Danh từ số ít → is."},{"id":"u1-s2-q3","prompt":"Lan and Mai ___ good at English.","blanks":[{"accept":["are"]}],"explanation":"Hai người → số nhiều → are."},{"id":"u1-s2-q4","prompt":"I ___ tired in the morning; I feel great.","blanks":[{"accept":["am not"]}],"explanation":"\"I feel great\" → nghĩa phủ định: am not."},{"id":"u1-s2-q5","prompt":"The computer room ___ small; it is quite large.","blanks":[{"accept":["is not"]}],"explanation":"Vế sau \"it is quite large\" → câu đầu phủ định: is not / isn't."},{"id":"u1-s2-q6","prompt":"___ your classroom large?","blanks":[{"accept":["Is"]}],"explanation":"Câu hỏi với chủ ngữ số ít: Is + S...?"},{"id":"u1-s2-q7","prompt":"___ Mai and Lan in the library now?","blanks":[{"accept":["Are"]}],"explanation":"Chủ ngữ số nhiều → Are."}]},{"id":"u1-s3","type":"gap","title":"Chia động từ trong ngoặc ở thì hiện tại đơn","level":2,"grammarPointId":"u1-s-es","items":[{"id":"u1-s3-q1","prompt":"My best friend (play) ___ badminton after school.","blanks":[{"accept":["plays"]}],"explanation":"Nguyên âm + y → chỉ thêm -s."},{"id":"u1-s3-q2","prompt":"Lan (study) ___ very hard.","blanks":[{"accept":["studies"]}],"explanation":"Phụ âm + y → đổi y thành i + es."},{"id":"u1-s3-q3","prompt":"They (do) ___ their homework in the evening.","blanks":[{"accept":["do"]}],"explanation":"They → nguyên mẫu."},{"id":"u1-s3-q4","prompt":"My brother (wash) ___ his face every morning.","blanks":[{"accept":["washes"]}],"explanation":"Tận cùng -sh → thêm -es."},{"id":"u1-s3-q5","prompt":"The bus (pass) ___ my house at 6:45 every morning.","blanks":[{"accept":["passes"]}],"explanation":"Tận cùng -ss → thêm -es."},{"id":"u1-s3-q6","prompt":"My sister (carry) ___ her books in a rucksack.","blanks":[{"accept":["carries"]}],"explanation":"carry: phụ âm r + y → carries."},{"id":"u1-s3-q7","prompt":"The school (have) ___ two computer rooms.","blanks":[{"accept":["has"]}],"explanation":"have → has với chủ ngữ số ít."},{"id":"u1-s3-q8","prompt":"Minh and Phong (finish) ___ school at 4 p.m.","blanks":[{"accept":["finish"]}],"explanation":"Hai người → số nhiều → giữ nguyên mẫu."}]},{"id":"u1-s4","type":"classify","title":"Phân loại cách phát âm đuôi -s / -es","level":2,"grammarPointId":"u1-s-es","items":[{"id":"u1-s4-q1","text":"likes","category":"/s/","explanation":"Âm cuối /k/ là âm vô thanh → /s/."},{"id":"u1-s4-q2","text":"plays","category":"/z/","explanation":"Âm cuối là nguyên âm → /z/."},{"id":"u1-s4-q3","text":"watches","category":"/ɪz/","explanation":"Âm cuối /tʃ/ → /ɪz/."},{"id":"u1-s4-q4","text":"reads","category":"/z/","explanation":"Âm cuối /d/ hữu thanh → /z/."},{"id":"u1-s4-q5","text":"helps","category":"/s/","explanation":"Âm cuối /p/ → /s/."},{"id":"u1-s4-q6","text":"goes","category":"/z/","explanation":"Âm cuối là nguyên âm → /z/."},{"id":"u1-s4-q7","text":"washes","category":"/ɪz/","explanation":"Âm cuối /ʃ/ → /ɪz/."},{"id":"u1-s4-q8","text":"works","category":"/s/","explanation":"Âm cuối /k/ → /s/."},{"id":"u1-s4-q9","text":"studies","category":"/z/","explanation":"Âm cuối là nguyên âm /i/ → /z/."},{"id":"u1-s4-q10","text":"finishes","category":"/ɪz/","explanation":"Âm cuối /ʃ/ → /ɪz/."},{"id":"u1-s4-q11","text":"opens","category":"/z/","explanation":"Âm cuối /n/ hữu thanh → /z/."},{"id":"u1-s4-q12","text":"takes","category":"/s/","explanation":"Âm cuối /k/ → /s/."},{"id":"u1-s4-q13","text":"uses","category":"/ɪz/","explanation":"Âm cuối /z/ → /ɪz/."},{"id":"u1-s4-q14","text":"starts","category":"/s/","explanation":"Âm cuối /t/ → /s/."},{"id":"u1-s4-q15","text":"lives","category":"/z/","explanation":"Âm cuối /v/ hữu thanh → /z/."}],"categories":["/s/","/z/","/ɪz/"]},{"id":"u1-s5","type":"reorder","title":"Sắp xếp từ thành câu hoàn chỉnh","level":2,"grammarPointId":"u1-frequency","items":[{"id":"u1-s5-q1","tokens":["usually","I","get up","at 6 o'clock"],"endPunct":".","accept":["I usually get up at 6 o'clock."],"explanation":"Trạng từ tần suất đứng trước động từ thường."},{"id":"u1-s5-q2","tokens":["always","Lan","is","friendly"],"endPunct":".","accept":["Lan is always friendly."],"explanation":"Với to be, trạng từ đứng sau am/is/are."},{"id":"u1-s5-q3","tokens":["often","Nam","goes","to the library","after school"],"endPunct":".","accept":["Nam often goes to the library after school."],"explanation":"S + often + V."},{"id":"u1-s5-q4","tokens":["don't","they","usually","play","football","in the rain"],"endPunct":".","accept":["They don't usually play football in the rain."],"explanation":"Trạng từ đứng sau don't/doesn't và trước động từ chính."},{"id":"u1-s5-q5","tokens":["never","my brother","is","late","for school"],"endPunct":".","accept":["My brother is never late for school."],"explanation":"is + never."},{"id":"u1-s5-q6","tokens":["on Saturdays","sometimes","we","visit","our grandparents"],"endPunct":".","accept":["We sometimes visit our grandparents on Saturdays.","Sometimes we visit our grandparents on Saturdays."],"explanation":"Sometimes có thể đứng đầu câu hoặc trước động từ; cụm thời gian ở cuối."},{"id":"u1-s5-q7","tokens":["How often","the school library","do","use","you"],"endPunct":"?","accept":["How often do you use the school library?"],"explanation":"How often + do + S + V?"}]},{"id":"u1-s6","type":"rewrite","title":"Viết lại câu ở thể phủ định","level":3,"grammarPointId":"u1-present-simple","items":[{"id":"u1-s6-q1","prompt":"She likes Art.","accept":["She doesn't like Art."],"explanation":"Động từ thường + chủ ngữ số ít → doesn't + V nguyên mẫu."},{"id":"u1-s6-q2","prompt":"We are in class 6A.","accept":["We aren't in class 6A."],"explanation":"Động từ to be → thêm not sau are."},{"id":"u1-s6-q3","prompt":"He does his homework after dinner.","accept":["He doesn't do his homework after dinner."],"explanation":"\"does\" ở đây là động từ chính → doesn't do."},{"id":"u1-s6-q4","prompt":"My school has a big library.","accept":["My school doesn't have a big library."],"explanation":"has → doesn't have."},{"id":"u1-s6-q5","prompt":"Nam studies French on Mondays.","accept":["Nam doesn't study French on Mondays."],"explanation":"studies → doesn't study."},{"id":"u1-s6-q6","prompt":"The school bus stops near my house.","accept":["The school bus doesn't stop near my house."],"explanation":"stops → doesn't stop."}]},{"id":"u1-s7","type":"rewrite","title":"Đặt câu hỏi và trả lời ngắn theo gợi ý","level":3,"grammarPointId":"u1-present-simple","items":[{"id":"u1-s7-q1","prompt":"She goes to school by bus. (Yes)","accept":["Does she go to school by bus? Yes, she does."],"explanation":"Does + S + V nguyên mẫu? → Yes, she does."},{"id":"u1-s7-q2","prompt":"Nam likes Science. (No)","accept":["Does Nam like Science? No, he doesn't."],"explanation":"Nam → he; phủ định ngắn: doesn't."},{"id":"u1-s7-q3","prompt":"The library is on the first floor. (No)","accept":["Is the library on the first floor? No, it isn't."],"explanation":"To be → đảo Is lên đầu."},{"id":"u1-s7-q4","prompt":"They are in the playground. (Yes)","accept":["Are they in the playground? Yes, they are."],"explanation":"Are + they...?"},{"id":"u1-s7-q5","prompt":"you / practise English – twice a week","accept":["How often do you practise English?","How often do you practise English? Twice a week."],"explanation":"Hỏi tần suất: How often + do + S + V?"}]},{"id":"u1-s8","type":"error","title":"Tìm và sửa lỗi sai","level":3,"grammarPointId":"u1-present-simple","items":[{"id":"u1-s8-q1","sentence":"She don't walk to school every day.","tokens":["She","don't","walk","to","school","every","day."],"errorStart":1,"errorEnd":1,"wrong":"don't","fix":["doesn't"],"corrected":["She doesn't walk to school every day."],"explanation":"She là ngôi 3 số ít → doesn't."},{"id":"u1-s8-q2","sentence":"Does Lan goes to the library after school?","tokens":["Does","Lan","goes","to","the","library","after","school?"],"errorStart":2,"errorEnd":2,"wrong":"goes","fix":["go"],"corrected":["Does Lan go to the library after school?"],"explanation":"Sau Does, động từ ở dạng nguyên mẫu."},{"id":"u1-s8-q3","sentence":"My classroom are very large.","tokens":["My","classroom","are","very","large."],"errorStart":2,"errorEnd":2,"wrong":"are","fix":["is"],"corrected":["My classroom is very large."],"explanation":"\"My classroom\" số ít → is."},{"id":"u1-s8-q4","sentence":"We usually are happy at school.","tokens":["We","usually","are","happy","at","school."],"errorStart":1,"errorEnd":2,"wrong":"usually are","fix":["are usually"],"corrected":["We are usually happy at school."],"explanation":"Trạng từ tần suất đứng SAU to be."},{"id":"u1-s8-q5","sentence":"I am usually do my homework after dinner.","tokens":["I","am","usually","do","my","homework","after","dinner."],"errorStart":1,"errorEnd":2,"wrong":"am usually","fix":["usually"],"corrected":["I usually do my homework after dinner."],"explanation":"Câu có động từ thường \"do\" → không dùng am."},{"id":"u1-s8-q6","sentence":"They never don't wear uniforms.","tokens":["They","never","don't","wear","uniforms."],"errorStart":1,"errorEnd":2,"wrong":"never don't","fix":["never"],"corrected":["They never wear uniforms."],"explanation":"Never đã mang nghĩa phủ định."},{"id":"u1-s8-q7","sentence":"Does your school has a gym?","tokens":["Does","your","school","has","a","gym?"],"errorStart":3,"errorEnd":3,"wrong":"has","fix":["have"],"corrected":["Does your school have a gym?"],"explanation":"Sau Does dùng nguyên mẫu have."},{"id":"u1-s8-q8","sentence":"Our teachers is always helpful.","tokens":["Our","teachers","is","always","helpful."],"errorStart":2,"errorEnd":2,"wrong":"is","fix":["are"],"corrected":["Our teachers are always helpful."],"explanation":"\"Our teachers\" số nhiều → are."},{"id":"u1-s8-q9","sentence":"Lan goes never to school late.","tokens":["Lan","goes","never","to","school","late."],"errorStart":1,"errorEnd":2,"wrong":"goes never","fix":["never goes"],"corrected":["Lan never goes to school late."],"explanation":"Trạng từ tần suất đứng trước động từ thường."}]},{"id":"u1-s9","type":"cloze","title":"Hoàn thành đoạn văn (tổng hợp Unit 1)","level":5,"grammarPointId":"u1-present-simple","items":[{"id":"u1-s9-q1","segments":[{"type":"text","text":"Hi! My name is Phong. I "},{"type":"blank","n":1,"mode":"input","accept":["am"]},{"type":"text","text":" (be) a student at My Dinh Secondary School. My school "},{"type":"blank","n":2,"mode":"input","accept":["is"]},{"type":"text","text":" (be) quite big and modern. Every school day, I "},{"type":"blank","n":3,"mode":"input","accept":["walk"]},{"type":"text","text":" (walk) to school with my best friend Nam. Nam "},{"type":"blank","n":4,"mode":"input","accept":["lives"]},{"type":"text","text":" (live) near my house, so we usually go together.\nOur first lesson "},{"type":"blank","n":5,"mode":"input","accept":["starts"]},{"type":"text","text":" (start) at 7:15. We "},{"type":"blank","n":6,"mode":"input","accept":["have"]},{"type":"text","text":" (have) English three times a week. Nam "},{"type":"blank","n":7,"mode":"input","accept":["likes"]},{"type":"text","text":" (like) English very much, and he often "},{"type":"blank","n":8,"mode":"input","accept":["reads"]},{"type":"text","text":" (read) English books in the library after class. I "},{"type":"blank","n":9,"mode":"input","accept":["don't read"]},{"type":"text","text":" (not / read) there every day because I also enjoy the sports club.\nOur teachers "},{"type":"blank","n":10,"mode":"input","accept":["are"]},{"type":"text","text":" (be) kind and helpful. They "},{"type":"blank","n":11,"mode":"input","accept":["don't give"]},{"type":"text","text":" (not / give) us too much homework on Fridays. My form teacher "},{"type":"blank","n":12,"mode":"input","accept":["teaches"]},{"type":"text","text":" (teach) English. She "},{"type":"blank","n":13,"mode":"input","accept":["is always"]},{"type":"text","text":" (always / be) cheerful and patient, so we enjoy her lessons.\nHow often "},{"type":"blank","n":14,"mode":"input","accept":["do"]},{"type":"text","text":" you practise English after school? I practise it twice a week, but Nam "},{"type":"blank","n":15,"mode":"input","accept":["practises"]},{"type":"text","text":" (practise) it almost every day."}],"blankCount":15}]}]},{"id":"u2","number":2,"title":"My House","titleVi":"Ngôi nhà của em","grammarPoints":[{"id":"u2-possessive","title":"Possessive Case","titleVi":"Sở hữu cách ('s)","sections":[{"heading":"Danh từ số ít và tên riêng","blocks":[{"type":"formula","text":"danh từ số ít / tên riêng + 's + vật được sở hữu"},{"type":"example","en":"This is Lan's bedroom.","vi":"Đây là phòng ngủ của Lan."},{"type":"example","en":"My brother's desk is near the window.","vi":"Bàn của anh tôi ở gần cửa sổ."},{"type":"rule","text":"Tên riêng tận cùng bằng -s vẫn thường thêm 's: James's room, Chris's bike."}]},{"heading":"Danh từ số nhiều","blocks":[{"type":"formula","text":"Số nhiều có -s: chỉ thêm ' → the students' books, my parents' room"},{"type":"formula","text":"Số nhiều bất quy tắc: thêm 's → children's room, men's shoes, women's bags"},{"type":"tip","text":"Xác định danh từ đã là số nhiều hay chưa trước khi đặt dấu nháy."}]},{"heading":"Sở hữu chung và sở hữu riêng","blocks":[{"type":"formula","text":"Sở hữu chung: chỉ danh từ cuối có 's → Lan and Mai's room (một phòng chung)"},{"type":"formula","text":"Sở hữu riêng: mỗi người đều có 's → Lan's and Mai's rooms (hai phòng riêng)"}]},{"heading":"Cụm thời gian và \"of\"","blocks":[{"type":"rule","text":"today's lesson; a week's holiday; two weeks' holiday"},{"type":"rule","text":"Với đồ vật: the + N + of + N → the door of the house; the colour of the wall"},{"type":"mistake","wrong":"Lan room.","right":"Lan's room."},{"type":"tip","text":"its = của nó; it's = it is / it has."}]}]},{"id":"u2-prepositions","title":"Prepositions of Place","titleVi":"Giới từ chỉ vị trí","sections":[{"heading":"in – on – at","blocks":[{"type":"formula","text":"in: ở trong một không gian → The books are in the cupboard."},{"type":"formula","text":"on: ở trên, có tiếp xúc bề mặt → The lamp is on the desk."},{"type":"formula","text":"at: tại một điểm → My mum is at home."}]},{"heading":"above – over – under – below","blocks":[{"type":"rule","text":"above: cao hơn (không tiếp xúc); over: phía trên, thường che phủ"},{"type":"rule","text":"under: ngay phía dưới; below: thấp hơn"},{"type":"example","en":"The cat is under the table.","vi":"Con mèo ở dưới gầm bàn."}]},{"heading":"Các giới từ khác","blocks":[{"type":"formula","text":"in front of (phía trước) · behind (phía sau) · next to / beside (bên cạnh)"},{"type":"formula","text":"between A and B (giữa hai vật) · among (giữa nhóm ≥3) · near (gần) · opposite (đối diện)"},{"type":"example","en":"The sofa is in front of the TV.","vi":"Ghế sofa ở phía trước TV."},{"type":"example","en":"The table is between the two chairs.","vi":"Cái bàn ở giữa hai cái ghế."},{"type":"mistake","wrong":"The TV is between the sofa to the bookcase.","right":"The TV is between the sofa and the bookcase."},{"type":"tip","text":"on = có tiếp xúc; above/over = không nhất thiết tiếp xúc."}]}]},{"id":"u2-there-is","title":"There is / There are","titleVi":"Cấu trúc There is / There are","sections":[{"heading":"Khẳng định","blocks":[{"type":"formula","text":"There is + a/an + N số ít → There is a sofa in the living room."},{"type":"formula","text":"There is + N không đếm được → There is some milk in the fridge."},{"type":"formula","text":"There are + N số nhiều → There are three bedrooms upstairs."}]},{"heading":"Phủ định và câu hỏi","blocks":[{"type":"formula","text":"There isn't / There aren't + ..."},{"type":"formula","text":"Is there + N số ít? → Yes, there is. / No, there isn't."},{"type":"formula","text":"Are there + N số nhiều? → Yes, there are. / No, there aren't."},{"type":"formula","text":"How many + N số nhiều + are there + ...?"}]},{"heading":"some / any","blocks":[{"type":"rule","text":"some: câu khẳng định; any: câu phủ định và câu hỏi"},{"type":"example","en":"Are there any chairs in the kitchen?","vi":"Trong bếp có cái ghế nào không?"}]},{"heading":"There is/are và have/has","blocks":[{"type":"rule","text":"There is/are: nhấn mạnh sự tồn tại ở đâu → There is a balcony in the flat."},{"type":"rule","text":"have/has: nhấn mạnh sự sở hữu → The flat has a balcony."},{"type":"mistake","wrong":"There is two bedrooms.","right":"There are two bedrooms."},{"type":"mistake","wrong":"Are there some chairs?","right":"Are there any chairs?"}]}]}],"exerciseSets":[{"id":"u2-s1","type":"mcq","title":"Chọn dạng sở hữu đúng","level":1,"grammarPointId":"u2-possessive","items":[{"id":"u2-s1-q1","prompt":"This is ___ bedroom.","options":["Lans'","Lan's","Lan","Lans"],"answerIndex":1,"explanation":"Tên riêng số ít + 's."},{"id":"u2-s1-q2","prompt":"The ___ books are on the shelf.","options":["students","students's","students'","student"],"answerIndex":2,"explanation":"Số nhiều có -s → chỉ thêm dấu '."},{"id":"u2-s1-q3","prompt":"That is the ___ room.","options":["children","childrens'","childrens","children's"],"answerIndex":3,"explanation":"children là số nhiều bất quy tắc (không có -s) → thêm 's."},{"id":"u2-s1-q4","prompt":"My ___ bedroom is upstairs.","options":["parent's","parents'","parent","parents's"],"answerIndex":1,"explanation":"parents (số nhiều có -s) → parents'."},{"id":"u2-s1-q5","prompt":"The ___ bags are in the hall.","options":["mens'","men's","men","mens"],"answerIndex":1,"explanation":"men là số nhiều bất quy tắc → men's."},{"id":"u2-s1-q6","prompt":"Lan and Mai share one room. It is ___ room.","options":["Lan's and Mai's","Lan and Mai's","Lan's and Mai","Lans and Mais"],"answerIndex":1,"explanation":"Sở hữu chung: chỉ danh từ cuối có 's."},{"id":"u2-s1-q7","prompt":"They have separate rooms. These are ___ rooms.","options":["Lan and Mai's","Lan's and Mai","Lan's and Mai's","Lan and Mais'"],"answerIndex":2,"explanation":"Sở hữu riêng: mỗi người đều có 's."},{"id":"u2-s1-q8","prompt":"We are having a two-week holiday. It is ___ holiday.","options":["two weeks'","two week's","two week","two weeks's"],"answerIndex":0,"explanation":"\"two weeks\" số nhiều có -s → weeks'."}]},{"id":"u2-s2","type":"gap","title":"Viết dạng sở hữu đúng từ gợi ý","level":2,"grammarPointId":"u2-possessive","items":[{"id":"u2-s2-q1","prompt":"That is ___ computer. (Nick)","blanks":[{"accept":["Nick's"]}],"explanation":"Tên riêng + 's."},{"id":"u2-s2-q2","prompt":"We play in the ___ room. (children)","blanks":[{"accept":["children's"]}],"explanation":"Số nhiều bất quy tắc + 's."},{"id":"u2-s2-q3","prompt":"The ___ office is on the first floor. (teachers)","blanks":[{"accept":["teachers'"]}],"explanation":"Số nhiều có -s → thêm '."},{"id":"u2-s2-q4","prompt":"This is ___ shared bedroom. (Lan and Mai)","blanks":[{"accept":["Lan and Mai's"]}],"explanation":"Phòng chung → chỉ danh từ cuối có 's."},{"id":"u2-s2-q5","prompt":"We are preparing for ___ lesson. (today)","blanks":[{"accept":["today's"]}],"explanation":"Cụm thời gian: today's lesson."},{"id":"u2-s2-q6","prompt":"My ___ garden is behind their house. (grandparents)","blanks":[{"accept":["grandparents'"]}],"explanation":"grandparents số nhiều có -s → grandparents'."}]},{"id":"u2-s3","type":"gap","title":"Điền giới từ chỉ vị trí","level":2,"grammarPointId":"u2-prepositions","items":[{"id":"u2-s3-q1","prompt":"The fridge is ___ the kitchen.","blanks":[{"accept":["in"]}],"explanation":"Ở trong một căn phòng → in."},{"id":"u2-s3-q2","prompt":"There is a small rug ___ the coffee table.","blanks":[{"accept":["under"]}],"explanation":"Tấm thảm nằm dưới bàn → under."},{"id":"u2-s3-q3","prompt":"The bookcase is ___ the desk, with only a tiny gap between them.","blanks":[{"accept":["next to"]}],"explanation":"Sát bên cạnh → next to."},{"id":"u2-s3-q4","prompt":"The lamp is ___ the desk and the bed.","blanks":[{"accept":["between"]}],"explanation":"between A and B."},{"id":"u2-s3-q5","prompt":"My bedroom is ___ my brother's bedroom, across the hall.","blanks":[{"accept":["opposite"]}],"explanation":"\"across the hall\" = đối diện → opposite."},{"id":"u2-s3-q6","prompt":"There is a park ___ my house, only two minutes away.","blanks":[{"accept":["near"]}],"explanation":"Cách hai phút → near (gần)."},{"id":"u2-s3-q7","prompt":"The shoes are ___ the bed, not on it.","blanks":[{"accept":["under"]}],"explanation":"Không ở trên → under."},{"id":"u2-s3-q8","prompt":"The mirror is ___ the washbasin.","blanks":[{"accept":["above"]}],"explanation":"Gương treo cao hơn bồn rửa, không chạm → above."},{"id":"u2-s3-q9","prompt":"Dad is standing ___ the front door, so I cannot open it.","blanks":[{"accept":["in front of"]}],"explanation":"Bố chắn phía trước cửa → in front of."}],"instruction":"Chọn từ: in • on • under • above • behind • in front of • next to • between • near • opposite"},{"id":"u2-s4","type":"gap","title":"Điền there is / there are / is there / are there / some / any / a / an","level":2,"grammarPointId":"u2-there-is","items":[{"id":"u2-s4-q1","prompt":"___ a sofa in the living room.","blanks":[{"accept":["There is"]}],"explanation":"\"a sofa\" số ít → There is."},{"id":"u2-s4-q2","prompt":"___ two bathrooms in our house.","blanks":[{"accept":["There are"]}],"explanation":"Số nhiều → There are."},{"id":"u2-s4-q3","prompt":"There is ___ armchair next to the window.","blanks":[{"accept":["an"]}],"explanation":"armchair bắt đầu bằng nguyên âm → an."},{"id":"u2-s4-q4","prompt":"There isn't ___ TV in my bedroom.","blanks":[{"accept":["a"]}],"explanation":"TV đọc /tiː/ bắt đầu bằng phụ âm → a."},{"id":"u2-s4-q5","prompt":"There aren't ___ chairs in the hall.","blanks":[{"accept":["any"]}],"explanation":"Câu phủ định → any."},{"id":"u2-s4-q6","prompt":"___ a balcony in your flat?","blanks":[{"accept":["Is there"]}],"explanation":"Câu hỏi + danh từ số ít → Is there."},{"id":"u2-s4-q7","prompt":"___ any books on the shelf?","blanks":[{"accept":["Are there"]}],"explanation":"Câu hỏi + số nhiều → Are there."},{"id":"u2-s4-q8","prompt":"There is ___ milk in the fridge.","blanks":[{"accept":["some"]}],"explanation":"Danh từ không đếm được, câu khẳng định → some."},{"id":"u2-s4-q9","prompt":"There is ___ orange lamp on the desk.","blanks":[{"accept":["an"]}],"explanation":"orange bắt đầu bằng nguyên âm → an."}]},{"id":"u2-s5","type":"rewrite","title":"Viết lại câu (there is/are ↔ have/has, phủ định, câu hỏi)","level":3,"grammarPointId":"u2-there-is","items":[{"id":"u2-s5-q1","prompt":"Our flat has a balcony. (There is)","accept":["There is a balcony in our flat."],"explanation":"has → There is ... in + nơi chốn."},{"id":"u2-s5-q2","prompt":"There are three bedrooms in my house. (has)","accept":["My house has three bedrooms."],"explanation":"Nơi chốn làm chủ ngữ + has."},{"id":"u2-s5-q3","prompt":"My bedroom has two windows. (There are)","accept":["There are two windows in my bedroom."],"explanation":"Số nhiều → There are."},{"id":"u2-s5-q4","prompt":"There are four chairs in the dining room. (has)","accept":["The dining room has four chairs."],"explanation":"The dining room + has."},{"id":"u2-s5-q5","prompt":"The flat has no balcony. (There isn't)","accept":["There isn't a balcony in the flat."],"explanation":"has no = There isn't a..."},{"id":"u2-s5-q6","prompt":"There are some books on the desk. (phủ định)","accept":["There aren't any books on the desk."],"explanation":"Phủ định: aren't + any (some → any)."},{"id":"u2-s5-q7","prompt":"There is a lamp next to the bed. (câu hỏi – Yes)","accept":["Is there a lamp next to the bed? Yes, there is."],"explanation":"Đảo is lên trước there."},{"id":"u2-s5-q8","prompt":"There are some pictures on the wall. (câu hỏi – No)","accept":["Are there any pictures on the wall? No, there aren't."],"explanation":"Câu hỏi dùng any."},{"id":"u2-s5-q9","prompt":"There are five rooms in the flat. (How many ...?)","accept":["How many rooms are there in the flat?"],"explanation":"How many + N số nhiều + are there...?"}]},{"id":"u2-s6","type":"error","title":"Tìm và sửa lỗi sai","level":3,"grammarPointId":"u2-there-is","items":[{"id":"u2-s6-q1","sentence":"This is Lan bedroom.","tokens":["This","is","Lan","bedroom."],"errorStart":2,"errorEnd":2,"wrong":"Lan","fix":["Lan's"],"corrected":["This is Lan's bedroom."],"explanation":"Thiếu sở hữu cách 's."},{"id":"u2-s6-q2","sentence":"The students's books are on the table.","tokens":["The","students's","books","are","on","the","table."],"errorStart":1,"errorEnd":1,"wrong":"students's","fix":["students'"],"corrected":["The students' books are on the table."],"explanation":"Số nhiều có -s chỉ thêm '."},{"id":"u2-s6-q3","sentence":"The childrens' room is upstairs.","tokens":["The","childrens'","room","is","upstairs."],"errorStart":1,"errorEnd":1,"wrong":"childrens'","fix":["children's"],"corrected":["The children's room is upstairs."],"explanation":"children đã là số nhiều → children's."},{"id":"u2-s6-q4","sentence":"The lamp is in the desk.","tokens":["The","lamp","is","in","the","desk."],"errorStart":3,"errorEnd":3,"wrong":"in","fix":["on"],"corrected":["The lamp is on the desk."],"explanation":"Đèn đặt trên mặt bàn → on."},{"id":"u2-s6-q5","sentence":"The picture is above of the sofa.","tokens":["The","picture","is","above","of","the","sofa."],"errorStart":3,"errorEnd":4,"wrong":"above of","fix":["above"],"corrected":["The picture is above the sofa."],"explanation":"above không đi với of."},{"id":"u2-s6-q6","sentence":"The garden is in front the house.","tokens":["The","garden","is","in","front","the","house."],"errorStart":3,"errorEnd":4,"wrong":"in front","fix":["in front of"],"corrected":["The garden is in front of the house."],"explanation":"Cụm đúng là in front of."},{"id":"u2-s6-q7","sentence":"There are a sofa in the living room.","tokens":["There","are","a","sofa","in","the","living","room."],"errorStart":1,"errorEnd":1,"wrong":"are","fix":["is"],"corrected":["There is a sofa in the living room."],"explanation":"\"a sofa\" số ít → There is."},{"id":"u2-s6-q8","sentence":"There aren't some chairs in the kitchen.","tokens":["There","aren't","some","chairs","in","the","kitchen."],"errorStart":2,"errorEnd":2,"wrong":"some","fix":["any"],"corrected":["There aren't any chairs in the kitchen."],"explanation":"Câu phủ định dùng any."},{"id":"u2-s6-q9","sentence":"Is there any books on the shelf?","tokens":["Is","there","any","books","on","the","shelf?"],"errorStart":0,"errorEnd":0,"wrong":"Is","fix":["Are"],"corrected":["Are there any books on the shelf?"],"explanation":"\"books\" số nhiều → Are there."},{"id":"u2-s6-q10","sentence":"My flat have a small balcony.","tokens":["My","flat","have","a","small","balcony."],"errorStart":2,"errorEnd":2,"wrong":"have","fix":["has"],"corrected":["My flat has a small balcony."],"explanation":"\"My flat\" số ít → has."},{"id":"u2-s6-q11","sentence":"The TV is between the sofa to the bookcase.","tokens":["The","TV","is","between","the","sofa","to","the","bookcase."],"errorStart":6,"errorEnd":6,"wrong":"to","fix":["and"],"corrected":["The TV is between the sofa and the bookcase."],"explanation":"between A and B."}]},{"id":"u2-s7","type":"reorder","title":"Sắp xếp từ thành câu đúng","level":3,"grammarPointId":"u2-prepositions","items":[{"id":"u2-s7-q1","tokens":["behind","there","is","garden","a","house","the"],"endPunct":".","accept":["There is a garden behind the house."],"explanation":"There is + a + N + giới từ + nơi chốn."},{"id":"u2-s7-q2","tokens":["TV","the","in front of","sofa","is","the"],"endPunct":".","accept":["The TV is in front of the sofa."],"explanation":"S + is + giới từ + N."},{"id":"u2-s7-q3","tokens":["any","are","chairs","kitchen","there","in","the"],"endPunct":"?","accept":["Are there any chairs in the kitchen?"],"explanation":"Câu hỏi: Are there any + N số nhiều?"},{"id":"u2-s7-q4","tokens":["between","table","the","two","is","chairs","the"],"endPunct":".","accept":["The table is between the two chairs."],"explanation":"between + hai vật."},{"id":"u2-s7-q5","tokens":["flat","balcony","our","has","small","a"],"endPunct":".","accept":["Our flat has a small balcony."],"explanation":"S + has + a + adj + N."},{"id":"u2-s7-q6","tokens":["milk","there","fridge","some","is","the","in"],"endPunct":".","accept":["There is some milk in the fridge."],"explanation":"N không đếm được → There is some."},{"id":"u2-s7-q7","tokens":["how many","there","rooms","are","your house","in"],"endPunct":"?","accept":["How many rooms are there in your house?"],"explanation":"How many + N + are there + ...?"}]},{"id":"u2-s8","type":"cloze","title":"Hoàn thành đoạn văn (tổng hợp Unit 2)","level":5,"grammarPointId":"u2-there-is","items":[{"id":"u2-s8-q1","segments":[{"type":"text","text":"Hi! I'm Mi. This is my family's new house. It is not very big, but it is comfortable. The front door is "},{"type":"blank","n":1,"mode":"select","options":["in","on","at"],"accept":["in"]},{"type":"text","text":" the middle of the house. When you go inside, there "},{"type":"blank","n":2,"mode":"input","accept":["is"]},{"type":"text","text":" a small hall. My "},{"type":"blank","n":3,"mode":"input","accept":["parents'"]},{"type":"text","text":" (parents) bedroom is on the first floor, and my brother's room is next "},{"type":"blank","n":4,"mode":"input","accept":["to"]},{"type":"text","text":" mine. There "},{"type":"blank","n":5,"mode":"input","accept":["are"]},{"type":"text","text":" two beds in his room because he sometimes shares it with our cousin.\nThe living room is my favourite place. There is "},{"type":"blank","n":6,"mode":"input","accept":["a"]},{"type":"text","text":" big sofa opposite the TV, and there are "},{"type":"blank","n":7,"mode":"input","accept":["some"]},{"type":"text","text":" family photos on the wall. A small table is "},{"type":"blank","n":8,"mode":"input","accept":["between"]},{"type":"text","text":" the sofa and the armchair. The bookshelf is "},{"type":"blank","n":9,"mode":"input","accept":["above"]},{"type":"text","text":" the sofa, so it is higher but does not touch it.\nOur kitchen "},{"type":"blank","n":10,"mode":"input","accept":["has"]},{"type":"text","text":" a new fridge and a dishwasher. There is some fruit on the table, but there isn't "},{"type":"blank","n":11,"mode":"input","accept":["any"]},{"type":"text","text":" milk in the fridge today. Behind the house, there is a garden. It is my "},{"type":"blank","n":12,"mode":"input","accept":["grandparents'"]},{"type":"text","text":" (grandparents) favourite place when they visit us."}],"blankCount":12}]}]},{"id":"u3","number":3,"title":"My Friends","titleVi":"Bạn bè của em","grammarPoints":[{"id":"u3-present-continuous","title":"Present Continuous","titleVi":"Thì hiện tại tiếp diễn","sections":[{"heading":"Cách dùng","blocks":[{"type":"rule","text":"Hành động đang xảy ra lúc nói"},{"type":"example","en":"They are playing football now.","vi":"Bây giờ họ đang chơi bóng đá."},{"type":"rule","text":"Việc đang diễn ra quanh thời điểm hiện tại / tình huống tạm thời"},{"type":"example","en":"Hoa is staying with her aunt this month.","vi":"Tháng này Hoa đang ở với cô."},{"type":"rule","text":"Mở rộng: kế hoạch đã sắp xếp trong tương lai gần"},{"type":"example","en":"We are meeting our friends tomorrow.","vi":"Ngày mai chúng tôi sẽ gặp bạn."}]},{"heading":"Cấu trúc","blocks":[{"type":"formula","text":"(+) S + am/is/are + V-ing"},{"type":"formula","text":"(–) S + am not / isn't / aren't + V-ing"},{"type":"formula","text":"(?) Am/Is/Are + S + V-ing?  →  Yes, S + am/is/are. / No, ..."},{"type":"formula","text":"(Wh) Wh-word + am/is/are + S + V-ing?"},{"type":"example","en":"Is Nam doing his homework? – Yes, he is.","vi":"Nam đang làm bài tập à? – Đúng vậy."},{"type":"example","en":"What are they doing? – They are playing chess.","vi":"Họ đang làm gì? – Họ đang chơi cờ."}]},{"heading":"Dấu hiệu nhận biết","blocks":[{"type":"rule","text":"now, right now, at the moment, at present, today, this week"},{"type":"rule","text":"Look!  Listen!  Be quiet!"},{"type":"mistake","wrong":"She is play badminton.","right":"She is playing badminton."},{"type":"mistake","wrong":"They not are talking.","right":"They are not talking."},{"type":"tip","text":"Luôn có am/is/are trước V-ing."}]}]},{"id":"u3-ing","title":"Adding -ing","titleVi":"Quy tắc thêm -ing","sections":[{"heading":"Quy tắc chính tả","blocks":[{"type":"formula","text":"Phần lớn động từ: V + ing → play → playing, read → reading"},{"type":"formula","text":"Tận cùng -e câm: bỏ e + ing → make → making, write → writing (ngoại lệ: see → seeing)"},{"type":"formula","text":"Tận cùng -ie: ie → y + ing → lie → lying, tie → tying"},{"type":"formula","text":"1 âm tiết dạng phụ âm–nguyên âm–phụ âm: gấp đôi phụ âm cuối → run → running, swim → swimming"},{"type":"formula","text":"Không gấp đôi w, x, y → snow → snowing, fix → fixing"},{"type":"formula","text":"Nhiều âm tiết, trọng âm ở âm cuối: gấp đôi → begin → beginning; trọng âm không ở cuối: visit → visiting"},{"type":"formula","text":"Anh-Anh: nguyên âm + l → gấp đôi l → travel → travelling"}]},{"heading":"Lỗi thường gặp","blocks":[{"type":"mistake","wrong":"swiming","right":"swimming"},{"type":"mistake","wrong":"lieing","right":"lying"},{"type":"mistake","wrong":"haveing","right":"having"}]}]},{"id":"u3-ps-vs-pc","title":"Present Simple vs Present Continuous","titleVi":"Phân biệt hiện tại đơn và hiện tại tiếp diễn","sections":[{"heading":"So sánh","blocks":[{"type":"formula","text":"Hiện tại đơn: thói quen, lịch trình, sự thật → She walks to school every day."},{"type":"formula","text":"Hiện tại tiếp diễn: đang xảy ra, tạm thời → She is walking to school now."},{"type":"rule","text":"every day / usually / often ↔ now / at the moment / Look! / Listen!"}]},{"heading":"Động từ chỉ trạng thái","blocks":[{"type":"rule","text":"like, love, know, understand, want, need, believe thường KHÔNG dùng V-ing."},{"type":"example","en":"I like this book.","vi":"Tôi thích cuốn sách này."},{"type":"mistake","wrong":"I am knowing the answer.","right":"I know the answer."}]},{"heading":"Cách làm bài nhanh","blocks":[{"type":"rule","text":"Bước 1: Tìm dấu hiệu thời gian."},{"type":"rule","text":"Bước 2: Xác định chủ ngữ để chọn am/is/are."},{"type":"rule","text":"Bước 3: Viết đúng dạng V-ing."},{"type":"rule","text":"Bước 4: Kiểm tra trật tự từ, dấu câu."}]}]}],"exerciseSets":[{"id":"u3-s1","type":"mcq","title":"Chọn đáp án đúng","level":1,"grammarPointId":"u3-present-continuous","items":[{"id":"u3-s1-q1","prompt":"Look! Nam ___ football with his friends.","options":["plays","is playing","play","playing"],"answerIndex":1,"explanation":"\"Look!\" → hành động đang xảy ra: is + V-ing."},{"id":"u3-s1-q2","prompt":"My sister ___ glasses today.","options":["wear","wears","is wearing","are wearing"],"answerIndex":2,"explanation":"\"today\" + tình huống tạm thời → is wearing."},{"id":"u3-s1-q3","prompt":"We ___ for the bus at the moment.","options":["wait","are waiting","is waiting","waits"],"answerIndex":1,"explanation":"\"at the moment\" + We → are waiting."},{"id":"u3-s1-q4","prompt":"Listen! The baby ___.","options":["is crying","cries","cry","are crying"],"answerIndex":0,"explanation":"\"Listen!\" → đang xảy ra; the baby số ít → is crying."},{"id":"u3-s1-q5","prompt":"I ___ TV now; I am studying.","options":["am not watching","not watch","isn't watching","don't watch"],"answerIndex":0,"explanation":"Phủ định với I: am not + V-ing."},{"id":"u3-s1-q6","prompt":"___ your brother reading a comic?","options":["Am","Are","Is","Does"],"answerIndex":2,"explanation":"\"your brother\" số ít → Is."},{"id":"u3-s1-q7","prompt":"What ___ they doing at the moment?","options":["is","do","does","are"],"answerIndex":3,"explanation":"they → are."},{"id":"u3-s1-q8","prompt":"The dog ___ under the table now.","options":["sleep","sleeps","is sleeping","are sleeping"],"answerIndex":2,"explanation":"\"now\" + the dog (số ít) → is sleeping."}]},{"id":"u3-s2","type":"gap","title":"Viết dạng V-ing đúng","level":2,"grammarPointId":"u3-ing","items":[{"id":"u3-s2-q1","prompt":"write → ___","blanks":[{"accept":["writing"]}],"explanation":"Bỏ e câm rồi thêm -ing."},{"id":"u3-s2-q2","prompt":"run → ___","blanks":[{"accept":["running"]}],"explanation":"CVC 1 âm tiết → gấp đôi n."},{"id":"u3-s2-q3","prompt":"lie → ___","blanks":[{"accept":["lying"]}],"explanation":"-ie → y + ing."},{"id":"u3-s2-q4","prompt":"swim → ___","blanks":[{"accept":["swimming"]}],"explanation":"Gấp đôi m."},{"id":"u3-s2-q5","prompt":"see → ___","blanks":[{"accept":["seeing"]}],"explanation":"Ngoại lệ: see → seeing (không bỏ e)."},{"id":"u3-s2-q6","prompt":"visit → ___","blanks":[{"accept":["visiting"]}],"explanation":"Trọng âm không ở âm cuối → không gấp đôi."},{"id":"u3-s2-q7","prompt":"begin → ___","blanks":[{"accept":["beginning"]}],"explanation":"Trọng âm ở âm cuối → gấp đôi n."},{"id":"u3-s2-q8","prompt":"travel → ___","blanks":[{"accept":["travelling","traveling"]}],"explanation":"Anh-Anh gấp đôi l: travelling (Anh-Mỹ: traveling)."},{"id":"u3-s2-q9","prompt":"have → ___","blanks":[{"accept":["having"]}],"explanation":"Bỏ e câm."},{"id":"u3-s2-q10","prompt":"tie → ___","blanks":[{"accept":["tying"]}],"explanation":"-ie → y + ing."}]},{"id":"u3-s3","type":"gap","title":"Chia động từ ở thì hiện tại tiếp diễn","level":2,"grammarPointId":"u3-present-continuous","items":[{"id":"u3-s3-q1","prompt":"I (write) ___ an email to my best friend.","blanks":[{"accept":["am writing"]}],"explanation":"I → am + V-ing."},{"id":"u3-s3-q2","prompt":"My sister (not / make) ___ a sandwich at present.","blanks":[{"accept":["isn't making"]}],"explanation":"Phủ định: isn't + V-ing."},{"id":"u3-s3-q3","prompt":"Lan (take) ___ photos in the garden.","blanks":[{"accept":["is taking"]}],"explanation":"take → taking (bỏ e)."},{"id":"u3-s3-q4","prompt":"The boys (run) ___ in the playground.","blanks":[{"accept":["are running"]}],"explanation":"Số nhiều → are; run → running."},{"id":"u3-s3-q5","prompt":"You (sit) ___ next to Minh today.","blanks":[{"accept":["are sitting"]}],"explanation":"sit → sitting."},{"id":"u3-s3-q6","prompt":"The baby (sleep) ___, so please be quiet.","blanks":[{"accept":["is sleeping"]}],"explanation":"Hành động đang xảy ra."},{"id":"u3-s3-q7","prompt":"Mai (not / wear) ___ glasses today.","blanks":[{"accept":["isn't wearing"]}],"explanation":"Phủ định với chủ ngữ số ít."}]},{"id":"u3-s4","type":"gap","title":"Hiện tại đơn hay hiện tại tiếp diễn?","level":4,"grammarPointId":"u3-ps-vs-pc","items":[{"id":"u3-s4-q1","prompt":"Lan usually (walk) ___ to school, but today she (go) ___ by bus.","blanks":[{"accept":["walks"]},{"accept":["is going"]}],"explanation":"\"usually\" → hiện tại đơn; \"today\" (khác thói quen) → hiện tại tiếp diễn."},{"id":"u3-s4-q2","prompt":"Look! The boys (play) ___ football in the yard.","blanks":[{"accept":["are playing"]}],"explanation":"\"Look!\" → đang xảy ra."},{"id":"u3-s4-q3","prompt":"My best friend often (help) ___ me with Maths.","blanks":[{"accept":["helps"]}],"explanation":"\"often\" → thói quen."},{"id":"u3-s4-q4","prompt":"Be quiet! The baby (sleep) ___.","blanks":[{"accept":["is sleeping"]}],"explanation":"\"Be quiet!\" → đang xảy ra."},{"id":"u3-s4-q5","prompt":"This week, I (stay) ___ with my grandparents.","blanks":[{"accept":["am staying"]}],"explanation":"\"This week\" → tạm thời."},{"id":"u3-s4-q6","prompt":"Listen! Someone (knock) ___ at the door.","blanks":[{"accept":["is knocking"]}],"explanation":"\"Listen!\" → đang xảy ra."},{"id":"u3-s4-q7","prompt":"Chau (like) ___ drawing pictures.","blanks":[{"accept":["likes"]}],"explanation":"like là động từ trạng thái → không dùng V-ing."},{"id":"u3-s4-q8","prompt":"The school bus (leave) ___ at 6:45 every morning.","blanks":[{"accept":["leaves"]}],"explanation":"Lịch trình cố định → hiện tại đơn."}]},{"id":"u3-s5","type":"rewrite","title":"Viết câu phủ định / câu hỏi","level":3,"grammarPointId":"u3-present-continuous","items":[{"id":"u3-s5-q1","prompt":"She is talking to Mai. (phủ định)","accept":["She isn't talking to Mai."],"explanation":"is + not + V-ing."},{"id":"u3-s5-q2","prompt":"They are playing chess at the moment. (phủ định)","accept":["They aren't playing chess at the moment."],"explanation":"are + not + V-ing."},{"id":"u3-s5-q3","prompt":"She is reading a book. (Yes/No – Yes)","accept":["Is she reading a book? Yes, she is."],"explanation":"Đảo is lên đầu câu."},{"id":"u3-s5-q4","prompt":"Nam is talking to Phong. (Yes/No – No)","accept":["Is Nam talking to Phong? No, he isn't."],"explanation":"Nam → he."},{"id":"u3-s5-q5","prompt":"The boys are playing badminton. (Yes/No – Yes)","accept":["Are the boys playing badminton? Yes, they are."],"explanation":"The boys → they."},{"id":"u3-s5-q6","prompt":"Nam is reading a comic in the library. (What)","accept":["What is Nam reading in the library?","What is Nam reading?"],"explanation":"Hỏi vật → What + is + S + V-ing?"},{"id":"u3-s5-q7","prompt":"They are playing football in the school yard. (Where)","accept":["Where are they playing football?"],"explanation":"Hỏi nơi chốn → Where."},{"id":"u3-s5-q8","prompt":"The students are laughing because the story is funny. (Why)","accept":["Why are the students laughing?"],"explanation":"Hỏi lý do → Why."}]},{"id":"u3-s6","type":"reorder","title":"Sắp xếp từ thành câu hoàn chỉnh","level":3,"grammarPointId":"u3-present-continuous","items":[{"id":"u3-s6-q1","tokens":["now","Nam","is","a book","reading"],"endPunct":".","accept":["Nam is reading a book now.","Now Nam is reading a book."],"explanation":"S + is + V-ing + O + now."},{"id":"u3-s6-q2","tokens":["not","I","am","TV","watching"],"endPunct":".","accept":["I am not watching TV."],"explanation":"S + am not + V-ing."},{"id":"u3-s6-q3","tokens":["wearing","is","today","Mai","glasses"],"endPunct":"?","accept":["Is Mai wearing glasses today?"],"explanation":"Is + S + V-ing...?"},{"id":"u3-s6-q4","tokens":["what","doing","your friends","are"],"endPunct":"?","accept":["What are your friends doing?"],"explanation":"Wh + are + S + V-ing?"},{"id":"u3-s6-q5","tokens":["is","the teacher","why","smiling"],"endPunct":"?","accept":["Why is the teacher smiling?"],"explanation":"Why + is + S + V-ing?"},{"id":"u3-s6-q6","tokens":["where","Chau","going","is"],"endPunct":"?","accept":["Where is Chau going?"],"explanation":"Where + is + S + V-ing?"},{"id":"u3-s6-q7","tokens":["tomorrow","meeting","we","are","our new classmates"],"endPunct":".","accept":["We are meeting our new classmates tomorrow.","Tomorrow we are meeting our new classmates."],"explanation":"Kế hoạch tương lai gần dùng hiện tại tiếp diễn."}]},{"id":"u3-s7","type":"error","title":"Tìm và sửa lỗi sai","level":3,"grammarPointId":"u3-present-continuous","items":[{"id":"u3-s7-q1","sentence":"She is play badminton now.","tokens":["She","is","play","badminton","now."],"errorStart":2,"errorEnd":2,"wrong":"play","fix":["playing"],"corrected":["She is playing badminton now."],"explanation":"Sau is phải là V-ing."},{"id":"u3-s7-q2","sentence":"They are not study at the moment.","tokens":["They","are","not","study","at","the","moment."],"errorStart":3,"errorEnd":3,"wrong":"study","fix":["studying"],"corrected":["They are not studying at the moment."],"explanation":"are not + V-ing."},{"id":"u3-s7-q3","sentence":"I is reading a new book this week.","tokens":["I","is","reading","a","new","book","this","week."],"errorStart":1,"errorEnd":1,"wrong":"is","fix":["am"],"corrected":["I am reading a new book this week."],"explanation":"I → am."},{"id":"u3-s7-q4","sentence":"Are Nam doing his homework?","tokens":["Are","Nam","doing","his","homework?"],"errorStart":0,"errorEnd":0,"wrong":"Are","fix":["Is"],"corrected":["Is Nam doing his homework?"],"explanation":"Nam số ít → Is."},{"id":"u3-s7-q5","sentence":"Look! The dog running in the garden.","tokens":["Look!","The","dog","running","in","the","garden."],"errorStart":2,"errorEnd":3,"wrong":"dog running","fix":["dog is running"],"corrected":["Look! The dog is running in the garden."],"explanation":"Thiếu to be trước V-ing."},{"id":"u3-s7-q6","sentence":"We are swiming in the pool now.","tokens":["We","are","swiming","in","the","pool","now."],"errorStart":2,"errorEnd":2,"wrong":"swiming","fix":["swimming"],"corrected":["We are swimming in the pool now."],"explanation":"swim → gấp đôi m."},{"id":"u3-s7-q7","sentence":"He is lieing on the sofa.","tokens":["He","is","lieing","on","the","sofa."],"errorStart":2,"errorEnd":2,"wrong":"lieing","fix":["lying"],"corrected":["He is lying on the sofa."],"explanation":"-ie → y + ing."},{"id":"u3-s7-q8","sentence":"What does Lan doing at the moment?","tokens":["What","does","Lan","doing","at","the","moment?"],"errorStart":1,"errorEnd":1,"wrong":"does","fix":["is"],"corrected":["What is Lan doing at the moment?"],"explanation":"Hiện tại tiếp diễn: What + is + S + V-ing?"},{"id":"u3-s7-q9","sentence":"The children not are playing football.","tokens":["
