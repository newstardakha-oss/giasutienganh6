"},{"type":"blank","n":11,"mode":"input","accept":["is"]},{"type":"text","text":" (be) very creative, so she "},{"type":"blank","n":12,"mode":"input","accept":["is designing"]},{"type":"text","text":" (design) the centre of the poster at the moment.\nWhat "},{"type":"blank","n":13,"mode":"input","accept":["are"]},{"type":"text","text":" your classmates doing now? After school, we "},{"type":"blank","n":14,"mode":"input","accept":["are meeting"]},{"type":"text","text":" (meet) some friends from another class to show them our poster."}],"blankCount":14}]}]},{"id":"u4","number":4,"title":"My Neighbourhood","titleVi":"Khu phố của em","grammarPoints":[{"id":"u4-comparative-short","title":"Comparative – Short Adjectives","titleVi":"So sánh hơn với tính từ ngắn","sections":[{"heading":"Cách dùng","blocks":[{"type":"rule","text":"So sánh hai người, hai vật hoặc hai nơi."},{"type":"formula","text":"S + be + adj-er + than + N/pronoun"},{"type":"example","en":"Tom is taller than Mary.","vi":"Tom cao hơn Mary."},{"type":"example","en":"My neighbourhood is quieter than yours.","vi":"Khu phố của tôi yên tĩnh hơn khu của bạn."}]},{"heading":"Quy tắc chính tả","blocks":[{"type":"formula","text":"Thông thường: + er → tall → taller, cheap → cheaper"},{"type":"formula","text":"Tận cùng -e: + r → large → larger, nice → nicer"},{"type":"formula","text":"Phụ âm + y: y → i + er → noisy → noisier, busy → busier"},{"type":"formula","text":"CVC 1 âm tiết: gấp đôi phụ âm → big → bigger, hot → hotter"},{"type":"formula","text":"Không gấp đôi w, x, y → new → newer"}]}]},{"id":"u4-comparative-long","title":"Comparative – Long & Irregular","titleVi":"So sánh hơn với tính từ dài và bất quy tắc","sections":[{"heading":"Tính từ dài","blocks":[{"type":"formula","text":"more + adj + than → modern → more modern, expensive → more expensive"},{"type":"rule","text":"Nhiều tính từ 2 âm tiết dùng more: peaceful, crowded, modern, boring."},{"type":"rule","text":"Tính từ 2 âm tiết tận cùng -y dùng -ier: noisy → noisier."},{"type":"example","en":"A city is usually more expensive than the countryside.","vi":"Thành phố thường đắt đỏ hơn nông thôn."}]},{"heading":"Bất quy tắc","blocks":[{"type":"formula","text":"good → better · bad → worse · far → farther/further · many/much → more · little → less"},{"type":"rule","text":"less + adj + than = kém ... hơn → This street is less noisy than the main road."}]},{"heading":"Từ nhấn mạnh (mở rộng)","blocks":[{"type":"formula","text":"much / far / a lot + so sánh hơn = hơn nhiều"},{"type":"formula","text":"a little / slightly + so sánh hơn = hơn một chút"},{"type":"example","en":"The new road is much wider than the old one.","vi":"Con đường mới rộng hơn nhiều so với đường cũ."},{"type":"mistake","wrong":"more bigger","right":"bigger"},{"type":"mistake","wrong":"more cheaper","right":"cheaper"},{"type":"tip","text":"Không nhầm then (sau đó) với than (hơn)."}]}]},{"id":"u4-comparative-questions","title":"Comparative Questions","titleVi":"Câu phủ định và câu hỏi so sánh hơn","sections":[{"heading":"Cấu trúc","blocks":[{"type":"formula","text":"(–) S + be + not + adj-er/more adj + than + ..."},{"type":"formula","text":"(?) Be + S + adj-er/more adj + than + ...?"},{"type":"example","en":"Is Binh Minh noisier than Long Son? – Yes, it is.","vi":"Bình Minh ồn hơn Long Sơn phải không? – Đúng."},{"type":"example","en":"Is Long Son more modern than Binh Minh? – No, it isn't.","vi":"Long Sơn hiện đại hơn Bình Minh không? – Không."}]},{"heading":"Mẹo làm bài","blocks":[{"type":"rule","text":"Bước 1: xác định tính từ ngắn hay dài. Bước 2: dùng -er hoặc more."},{"type":"rule","text":"Bước 3: kiểm tra chính tả (-e, -y, CVC). Bước 4: kiểm tra than và động từ be."},{"type":"mistake","wrong":"This area more peaceful than that one.","right":"This area is more peaceful than that one."},{"type":"mistake","wrong":"The city is crowdeder.","right":"The city is more crowded."}]}]}],"exerciseSets":[{"id":"u4-s1","type":"mcq","title":"Chọn đáp án đúng","level":1,"grammarPointId":"u4-comparative-short","items":[{"id":"u4-s1-q1","prompt":"My neighbourhood is ___ than yours.","options":["noisiest","more noisy","noisy","noisier"],"answerIndex":3,"explanation":"noisy: phụ âm + y → noisier."},{"id":"u4-s1-q2","prompt":"The new shop is ___ than the old one.","options":["modernest","moderner","more modern","modern"],"answerIndex":2,"explanation":"modern là tính từ dài → more modern."},{"id":"u4-s1-q3","prompt":"The city centre is ___ than the suburb.","options":["crowdeder","more crowded","most crowded","crowded"],"answerIndex":1,"explanation":"crowded dùng more."},{"id":"u4-s1-q4","prompt":"Living here is ___ than living near the station.","options":["more peaceful","peacefuler","peacefuller","most peaceful"],"answerIndex":0,"explanation":"peaceful → more peaceful."},{"id":"u4-s1-q5","prompt":"This road is ___ than the old road.","options":["wide","more wide","widest","wider"],"answerIndex":3,"explanation":"wide tận cùng -e → chỉ thêm -r."},{"id":"u4-s1-q6","prompt":"This bus stop is ___ to my house than the other one.","options":["more near","nearer","nearest","near"],"answerIndex":1,"explanation":"near là tính từ ngắn → nearer."},{"id":"u4-s1-q7","prompt":"The air here is ___ than in the city centre.","options":["more good","gooder","better","best"],"answerIndex":2,"explanation":"good → better (bất quy tắc)."},{"id":"u4-s1-q8","prompt":"The traffic today is ___ than yesterday.","options":["worse","badder","more bad","worst"],"answerIndex":0,"explanation":"bad → worse (bất quy tắc)."}]},{"id":"u4-s2","type":"mcq","title":"Chọn cấu trúc so sánh phù hợp","level":3,"grammarPointId":"u4-comparative-long","items":[{"id":"u4-s2-q1","prompt":"This area is ___ noisy than the city centre.","options":["less","fewer","little","least"],"answerIndex":0,"explanation":"less + adj + than = kém ... hơn."},{"id":"u4-s2-q2","prompt":"The new road is ___ wider than the old one.","options":["much","many","more","most"],"answerIndex":0,"explanation":"much + so sánh hơn = hơn nhiều."},{"id":"u4-s2-q3","prompt":"The museum is more interesting ___ the shop.","options":["than","then","that","as"],"answerIndex":0,"explanation":"So sánh hơn đi với than."},{"id":"u4-s2-q4","prompt":"The old town is ___ crowded than the city centre.","options":["less","least","fewer","few"],"answerIndex":0,"explanation":"less crowded than."},{"id":"u4-s2-q5","prompt":"The new building is ___ modern than the old one.","options":["more","-er","most","much moreer"],"answerIndex":0,"explanation":"modern → more modern."},{"id":"u4-s2-q6","prompt":"This lane is ___ narrower than the main road.","options":["a little","more","many","most"],"answerIndex":0,"explanation":"a little + so sánh hơn = hơn một chút."}]},{"id":"u4-s3","type":"gap","title":"Viết dạng so sánh hơn","level":2,"grammarPointId":"u4-comparative-short","items":[{"id":"u4-s3-q1","prompt":"large → ___","blanks":[{"accept":["larger"]}],"explanation":"Tận cùng -e → + r."},{"id":"u4-s3-q2","prompt":"big → ___","blanks":[{"accept":["bigger"]}],"explanation":"CVC → gấp đôi g."},{"id":"u4-s3-q3","prompt":"hot → ___","blanks":[{"accept":["hotter"]}],"explanation":"CVC → gấp đôi t."},{"id":"u4-s3-q4","prompt":"busy → ___","blanks":[{"accept":["busier"]}],"explanation":"Phụ âm + y → ier."},{"id":"u4-s3-q5","prompt":"modern → ___","blanks":[{"accept":["more modern"]}],"explanation":"Tính từ dài → more."},{"id":"u4-s3-q6","prompt":"expensive → ___","blanks":[{"accept":["more expensive"]}],"explanation":"Tính từ dài → more."},{"id":"u4-s3-q7","prompt":"good → ___","blanks":[{"accept":["better"]}],"explanation":"Bất quy tắc."},{"id":"u4-s3-q8","prompt":"bad → ___","blanks":[{"accept":["worse"]}],"explanation":"Bất quy tắc."}]},{"id":"u4-s4","type":"gap","title":"Chia tính từ trong ngoặc","level":2,"grammarPointId":"u4-comparative-long","items":[{"id":"u4-s4-q1","prompt":"The new library is ___ than the old one. (modern)","blanks":[{"accept":["more modern"]}],"explanation":"Tính từ dài."},{"id":"u4-s4-q2","prompt":"My street is ___ than the main road. (quiet)","blanks":[{"accept":["quieter"]}],"explanation":"quiet → quieter."},{"id":"u4-s4-q3","prompt":"The market is ___ in the morning than in the afternoon. (busy)","blanks":[{"accept":["busier"]}],"explanation":"busy → busier."},{"id":"u4-s4-q4","prompt":"The city centre is ___ than my neighbourhood. (crowded)","blanks":[{"accept":["more crowded"]}],"explanation":"crowded → more crowded."},{"id":"u4-s4-q5","prompt":"The traffic here is ___ than near the school. (bad)","blanks":[{"accept":["worse"]}],"explanation":"bad → worse."},{"id":"u4-s4-q6","prompt":"The square is ___ than the small park. (big)","blanks":[{"accept":["bigger"]}],"explanation":"big → bigger."},{"id":"u4-s4-q7","prompt":"Taking the bus is ___ than walking for me. (convenient)","blanks":[{"accept":["more convenient"]}],"explanation":"Tính từ dài."},{"id":"u4-s4-q8","prompt":"Our neighbourhood is ___ than it was last year. (clean)","blanks":[{"accept":["cleaner"]}],"explanation":"clean → cleaner."}]},{"id":"u4-s5","type":"gap","title":"So sánh hai khu phố theo bảng thông tin","level":4,"grammarPointId":"u4-comparative-questions","items":[{"id":"u4-s5-q1","prompt":"Binh Minh is ___ than Long Son. (noisy)","blanks":[{"accept":["noisier"]}],"explanation":"Bình Minh ồn → noisier."},{"id":"u4-s5-q2","prompt":"Long Son is ___ than Binh Minh. (quiet)","blanks":[{"accept":["quieter"]}],"explanation":"Long Sơn yên tĩnh → quieter."},{"id":"u4-s5-q3","prompt":"Binh Minh is ___ than Long Son. (modern)","blanks":[{"accept":["more modern"]}],"explanation":"Bình Minh hiện đại → more modern."},{"id":"u4-s5-q4","prompt":"Long Son is ___ than Binh Minh. (cheap)","blanks":[{"accept":["cheaper"]}],"explanation":"Giá ở Long Sơn rẻ → cheaper."},{"id":"u4-s5-q5","prompt":"The atmosphere in Long Son is ___ noisy than in Binh Minh.","blanks":[{"accept":["less"]}],"explanation":"Long Sơn kém ồn hơn → less."},{"id":"u4-s5-q6","prompt":"Binh Minh has ___ traffic than Long Son. (heavy)","blanks":[{"accept":["heavier"]}],"explanation":"heavy → heavier."},{"id":"u4-s5-q7","prompt":"Binh Minh is ___ peaceful than Long Son.","blanks":[{"accept":["less"]}],"explanation":"Bình Minh kém yên bình hơn → less."}],"instruction":"Bảng: Binh Minh – traffic heavy, noisy, crowded, modern, expensive, less clean air, busy life | Long Son – light traffic, quiet, not crowded, traditional, cheap, clean air, peaceful life"},{"id":"u4-s6","type":"rewrite","title":"Viết lại câu so sánh","level":4,"grammarPointId":"u4-comparative-questions","items":[{"id":"u4-s6-q1","prompt":"The old road is 6 metres wide. The new road is 10 metres wide. (The new road / wide)","accept":["The new road is wider than the old road.","The new road is wider than the old one."],"explanation":"wide → wider."},{"id":"u4-s6-q2","prompt":"A bus ticket costs 10,000 dong. A taxi ride costs 80,000 dong. (A taxi ride / expensive)","accept":["A taxi ride is more expensive than a bus ticket."],"explanation":"Tính từ dài → more expensive."},{"id":"u4-s6-q3","prompt":"The city centre has more traffic than my neighbourhood. (My neighbourhood / quiet)","accept":["My neighbourhood is quieter than the city centre."],"explanation":"Ít xe hơn → yên tĩnh hơn."},{"id":"u4-s6-q4","prompt":"Long Son is peaceful. Binh Minh is noisy. (Long Son / peaceful)","accept":["Long Son is more peaceful than Binh Minh."],"explanation":"peaceful → more peaceful."},{"id":"u4-s6-q5","prompt":"The city air is bad. The countryside air is good. (The countryside air / good)","accept":["The countryside air is better than the city air."],"explanation":"good → better."},{"id":"u4-s6-q6","prompt":"the new library / modern / the old library (câu hỏi – Yes)","accept":["Is the new library more modern than the old library? Yes, it is."],"explanation":"Be + S + more adj + than...?"},{"id":"u4-s6-q7","prompt":"your street / noisy / the main road (câu hỏi – No)","accept":["Is your street noisier than the main road? No, it isn't."],"explanation":"Be + S + adj-er + than...?"}]},{"id":"u4-s7","type":"reorder","title":"Sắp xếp từ thành câu so sánh","level":3,"grammarPointId":"u4-comparative-long","items":[{"id":"u4-s7-q1","tokens":["my neighbourhood","quieter","is","than","the city centre"],"endPunct":".","accept":["My neighbourhood is quieter than the city centre."],"explanation":"S + is + adj-er + than + N."},{"id":"u4-s7-q2","tokens":["more modern","the new library","than","is","the old one"],"endPunct":".","accept":["The new library is more modern than the old one."],"explanation":"S + is + more adj + than."},{"id":"u4-s7-q3","tokens":["the suburb","less crowded","than","is","the centre"],"endPunct":".","accept":["The suburb is less crowded than the centre."],"explanation":"less + adj + than."},{"id":"u4-s7-q4","tokens":["a little","this street","wider","that lane","is","than"],"endPunct":".","accept":["This street is a little wider than that lane."],"explanation":"a little + so sánh hơn."},{"id":"u4-s7-q5","tokens":["much","the new road","safer","the old road","is","than"],"endPunct":".","accept":["The new road is much safer than the old road."],"explanation":"much + so sánh hơn."},{"id":"u4-s7-q6","tokens":["nearer","the library","my house","than","the station","is","to"],"endPunct":".","accept":["The library is nearer to my house than the station."],"explanation":"nearer to + nơi chốn + than."}]},{"id":"u4-s8","type":"error","title":"Tìm và sửa lỗi sai","level":3,"grammarPointId":"u4-comparative-long","items":[{"id":"u4-s8-q1","sentence":"This street is more cleaner than that one.","tokens":["This","street","is","more","cleaner","than","that","one."],"errorStart":3,"errorEnd":4,"wrong":"more cleaner","fix":["cleaner"],"corrected":["This street is cleaner than that one."],"explanation":"Không dùng more với tính từ ngắn đã thêm -er."},{"id":"u4-s8-q2","sentence":"My neighbourhood is noisyer than yours.","tokens":["My","neighbourhood","is","noisyer","than","yours."],"errorStart":3,"errorEnd":3,"wrong":"noisyer","fix":["noisier"],"corrected":["My neighbourhood is noisier than yours."],"explanation":"Phụ âm + y → ier."},{"id":"u4-s8-q3","sentence":"This shop is more cheap than the supermarket.","tokens":["This","shop","is","more","cheap","than","the","supermarket."],"errorStart":3,"errorEnd":4,"wrong":"more cheap","fix":["cheaper"],"corrected":["This shop is cheaper than the supermarket."],"explanation":"cheap là tính từ ngắn → cheaper."},{"id":"u4-s8-q4","sentence":"The city centre is crowded than the suburb.","tokens":["The","city","centre","is","crowded","than","the","suburb."],"errorStart":4,"errorEnd":4,"wrong":"crowded","fix":["more crowded"],"corrected":["The city centre is more crowded than the suburb."],"explanation":"Thiếu more."},{"id":"u4-s8-q5","sentence":"This area is more peaceful then the station area.","tokens":["This","area","is","more","peaceful","then","the","station","area."],"errorStart":5,"errorEnd":5,"wrong":"then","fix":["than"],"corrected":["This area is more peaceful than the station area."],"explanation":"than = hơn; then = sau đó."},{"id":"u4-s8-q6","sentence":"The market is more busier in the morning.","tokens":["The","market","is","more","busier","in","the","morning."],"errorStart":3,"errorEnd":4,"wrong":"more busier","fix":["busier"],"corrected":["The market is busier in the morning."],"explanation":"Không dùng more + -er."},{"id":"u4-s8-q7","sentence":"This café is gooder than the one near school.","tokens":["This","café","is","gooder","than","the","one","near","school."],"errorStart":3,"errorEnd":3,"wrong":"gooder","fix":["better"],"corrected":["This café is better than the one near school."],"explanation":"good → better."},{"id":"u4-s8-q8","sentence":"The suburb is less noisier than the city centre.","tokens":["The","suburb","is","less","noisier","than","the","city","centre."],"errorStart":4,"errorEnd":4,"wrong":"noisier","fix":["noisy"],"corrected":["The suburb is less noisy than the city centre."],"explanation":"less + tính từ nguyên dạng."},{"id":"u4-s8-q9","sentence":"Is the new cinema excitinger than the old one?","tokens":["Is","the","new","cinema","excitinger","than","the","old","one?"],"errorStart":4,"errorEnd":4,"wrong":"excitinger","fix":["more exciting"],"corrected":["Is the new cinema more exciting than the old one?"],"explanation":"exciting là tính từ dài."}]},{"id":"u4-s9","type":"cloze","title":"Hoàn thành bức thư (tổng hợp Unit 4)","level":5,"grammarPointId":"u4-comparative-long","items":[{"id":"u4-s9-q1","segments":[{"type":"text","text":"Dear Nick,\nHow are you? I'm having a great time in a seaside neighbourhood. It is quite different from my area in Ha Noi.\nThe streets here are "},{"type":"blank","n":1,"mode":"input","accept":["quieter"]},{"type":"text","text":" (quiet) than the streets near my home, and the air is "},{"type":"blank","n":2,"mode":"input","accept":["cleaner"]},{"type":"text","text":" (clean) than in Ha Noi. The beach road is "},{"type":"blank","n":3,"mode":"input","accept":["wider"]},{"type":"text","text":" (wide) than the old road in my neighbourhood. There are fewer motorbikes, so it is also "},{"type":"blank","n":4,"mode":"input","accept":["safer"]},{"type":"text","text":" (safe) for people to walk.\nSome new hotels are "},{"type":"blank","n":5,"mode":"input","accept":["more modern"]},{"type":"text","text":" (modern) than the older buildings. Food here is "},{"type":"blank","n":6,"mode":"input","accept":["cheaper"]},{"type":"text","text":" (cheap) than in the city centre, while the seafood restaurants are a little "},{"type":"blank","n":7,"mode":"input","accept":["more expensive"]},{"type":"text","text":" (expensive) than the small local cafés.\nIn the morning, the market is "},{"type":"blank","n":8,"mode":"input","accept":["busier"]},{"type":"text","text":" (busy) than it is in the afternoon. However, the park near the beach is much "},{"type":"blank","n":9,"mode":"input","accept":["more peaceful"]},{"type":"text","text":" (peaceful) than the market area. I think the view from the hill is "},{"type":"blank","n":10,"mode":"input","accept":["better"]},{"type":"text","text":" (good) than the view from my street at home.\nThe bus stop is "},{"type":"blank","n":11,"mode":"input","accept":["nearer","closer"]},{"type":"text","text":" (near) to our hotel than the railway station, and travelling by bus is "},{"type":"blank","n":12,"mode":"input","accept":["more convenient"]},{"type":"text","text":" (convenient) than walking long distances in the hot sun. At night, the beach is "},{"type":"blank","n":13,"mode":"input","accept":["less"]},{"type":"text","text":" crowded than during the day, so it is very relaxing.\nSee you soon,\nVy"}],"blankCount":13}]}]},{"id":"u5","number":5,"title":"Natural Wonders of Viet Nam","titleVi":"Kỳ quan thiên nhiên Việt Nam","grammarPoints":[{"id":"u5-countable","title":"Countable & Uncountable Nouns","titleVi":"Danh từ đếm được và không đếm được","sections":[{"heading":"Danh từ đếm được","blocks":[{"type":"rule","text":"Có thể đếm bằng số, có dạng số ít và số nhiều."},{"type":"formula","text":"a/an + N số ít → a mountain, an island"},{"type":"formula","text":"số đếm / many / a few / some / a lot of + N số nhiều → three islands, many caves"},{"type":"example","en":"There are many caves in this area.","vi":"Có nhiều hang động ở khu vực này."}]},{"heading":"Danh từ không đếm được","blocks":[{"type":"rule","text":"Không dùng trực tiếp với số đếm, thường không có dạng số nhiều."},{"type":"rule","text":"Thường gặp: water, air, sand, rice, information, advice, furniture, homework, luggage."},{"type":"formula","text":"much / a little / some / a lot of + N không đếm được → some water, a little rice"},{"type":"mistake","wrong":"an advice","right":"a piece of advice"},{"type":"mistake","wrong":"informations","right":"information"}]},{"heading":"Hỏi về số lượng","blocks":[{"type":"formula","text":"How many + N đếm được số nhiều + ...? → How many islands are there?"},{"type":"formula","text":"How much + N không đếm được + ...? → How much water do we need?"},{"type":"rule","text":"many / a few → đếm được; much / a little → không đếm được; some / a lot of → cả hai."}]},{"heading":"Đơn vị đo / vật chứa","blocks":[{"type":"formula","text":"a bottle of water · a bowl of rice · a loaf of bread · a piece of information / advice"},{"type":"rule","text":"Số nhiều đổi ở đơn vị: two bottles of water; three pieces of advice."}]}]},{"id":"u5-plural","title":"Plural Nouns","titleVi":"Danh từ số nhiều – quy tắc và ngoại lệ","sections":[{"heading":"Quy tắc","blocks":[{"type":"formula","text":"Phần lớn: + s → cave → caves; nguyên âm + y: + s → day → days"},{"type":"formula","text":"-s, -ss, -sh, -ch, -x, -z: + es → bus → buses, beach → beaches, box → boxes"},{"type":"formula","text":"Phụ âm + o: thường + es → tomato → tomatoes (ngoại lệ: photos, pianos)"},{"type":"formula","text":"Phụ âm + y: y → ies → city → cities"},{"type":"formula","text":"-f/-fe → -ves → leaf → leaves, knife → knives (ngoại lệ: roofs, cliffs)"}]},{"heading":"Bất quy tắc / không đổi","blocks":[{"type":"formula","text":"man → men · woman → women · child → children · person → people"},{"type":"formula","text":"foot → feet · tooth → teeth · mouse → mice"},{"type":"formula","text":"sheep → sheep · deer → deer · fish → fish"},{"type":"tip","text":"Danh từ không đếm được không tự thêm -s: water, information, advice, furniture."}]}]},{"id":"u5-must","title":"Must / Mustn't","titleVi":"Bắt buộc và cấm đoán","sections":[{"heading":"Ý nghĩa","blocks":[{"type":"formula","text":"must = phải (quy định, điều cần thiết) → You must follow the signs."},{"type":"formula","text":"mustn't = không được phép, bị cấm → You mustn't pick flowers."}]},{"heading":"Cấu trúc","blocks":[{"type":"formula","text":"S + must / mustn't + V nguyên mẫu (không \"to\", không thêm -s)"},{"type":"formula","text":"Must + S + V...? → Yes, you must. / No, you don't have to."},{"type":"example","en":"We must bring water.","vi":"Chúng ta phải mang theo nước."},{"type":"example","en":"They mustn't litter.","vi":"Họ không được xả rác."},{"type":"tip","text":"mustn't (bị cấm) khác don't have to (không bắt buộc)."},{"type":"mistake","wrong":"He musts go.","right":"He must go."},{"type":"mistake","wrong":"We must to wear helmets.","right":"We must wear helmets."},{"type":"mistake","wrong":"You don't must swim here.","right":"You mustn't swim here."}]}]}],"exerciseSets":[{"id":"u5-s1","type":"classify","title":"Phân loại danh từ đếm được / không đếm được","level":1,"grammarPointId":"u5-countable","items":[{"id":"u5-s1-q1","text":"islands","context":"Ha Long Bay has many islands.","category":"Countable","explanation":"Có dạng số nhiều -s."},{"id":"u5-s1-q2","text":"water","context":"We need some water for the hike.","category":"Uncountable","explanation":"Chất lỏng, không đếm được."},{"id":"u5-s1-q3","text":"mountain","context":"There is a high mountain near the village.","category":"Countable","explanation":"Đi với \"a\"."},{"id":"u5-s1-q4","text":"information","context":"Please give me some information about the cave.","category":"Uncountable","explanation":"information không có số nhiều."},{"id":"u5-s1-q5","text":"sand","context":"The beach has soft white sand.","category":"Uncountable","explanation":"Cát: không đếm từng hạt."},{"id":"u5-s1-q6","text":"waterfalls","context":"There are three waterfalls in this park.","category":"Countable","explanation":"Đi với số đếm \"three\"."},{"id":"u5-s1-q7","text":"luggage","context":"We packed our luggage before the trip.","category":"Uncountable","explanation":"luggage không đếm được."},{"id":"u5-s1-q8","text":"advice","context":"The guide gave us useful advice.","category":"Uncountable","explanation":"advice không đếm được (a piece of advice)."},{"id":"u5-s1-q9","text":"rice","context":"There is a little rice left for lunch.","category":"Uncountable","explanation":"Đi với \"a little\"."},{"id":"u5-s1-q10","text":"deer","context":"We saw several deer near the for  don't have some lucky money.","right":"We don't have any lucky money."}]}]}],"exerciseSets":[{"id":"u6-s1","type":"mcq","title":"Chọn should / shouldn't đúng","level":1,"grammarPointId":"u6-should","items":[{"id":"u6-s1-q1","prompt":"Children ___ behave well when they visit their grandparents.","options":["should to","should","shoulds","shouldn't"],"answerIndex":1,"explanation":"Việc tốt nên làm → should."},{"id":"u6-s1-q2","prompt":"You ___ break things during Tet.","options":["should to","shouldn't","shoulds","should"],"answerIndex":1,"explanation":"Việc không nên làm → shouldn't."},{"id":"u6-s1-q3","prompt":"You ___ eat too many sweets.","options":["shouldn't","shoulds","should to","should"],"answerIndex":0,"explanation":"\"too many\" → không nên."},{"id":"u6-s1-q4","prompt":"Children ___ fight with their brothers or sisters.","options":["should","shoulds","shouldn't","should to"],"answerIndex":2,"explanation":"Đánh nhau → không nên."},{"id":"u6-s1-q5","prompt":"You ___ make a wish for the new year.","options":["shouldn't","should to","shoulds","should"],"answerIndex":3,"explanation":"Việc tốt → should."},{"id":"u6-s1-q6","prompt":"You ___ say bad words on the first days of the year.","options":["should to","shouldn't","shoulds","should"],"answerIndex":1,"explanation":"Nói điều xấu → không nên."},{"id":"u6-s1-q7","prompt":"Children ___ spend all their lucky money at once.","options":["shouldn't","should","shoulds","should to"],"answerIndex":0,"explanation":"Tiêu hết một lúc → không nên."},{"id":"u6-s1-q8","prompt":"You ___ thank adults when you receive lucky money.","options":["should","should to","shouldn't","shoulds"],"answerIndex":0,"explanation":"Cảm ơn → nên."}]},{"id":"u6-s2","type":"gap","title":"Hoàn thành với should / shouldn't + V","level":2,"grammarPointId":"u6-should","items":[{"id":"u6-s2-q1","prompt":"Children ___ (help) their parents decorate the house before Tet.","blanks":[{"accept":["should help"]}],"explanation":"Việc tốt → should."},{"id":"u6-s2-q2","prompt":"You ___ (break) anything on New Year's Day.","blanks":[{"accept":["shouldn't break"]}],"explanation":"Kiêng làm vỡ đồ → shouldn't."},{"id":"u6-s2-q3","prompt":"You ___ (eat) too many sweets before dinner.","blanks":[{"accept":["shouldn't eat"]}],"explanation":"\"too many\" → shouldn't."},{"id":"u6-s2-q4","prompt":"Children ___ (fight) at family gatherings.","blanks":[{"accept":["shouldn't fight"]}],"explanation":"Không nên đánh nhau."},{"id":"u6-s2-q5","prompt":"We ___ (prepare) some special food for our guests.","blanks":[{"accept":["should prepare"]}],"explanation":"Việc tốt → should."},{"id":"u6-s2-q6","prompt":"You ___ (throw) rubbish on the street.","blanks":[{"accept":["shouldn't throw"]}],"explanation":"Không nên xả rác."},{"id":"u6-s2-q7","prompt":"You ___ (spend) all your lucky money immediately.","blanks":[{"accept":["shouldn't spend"]}],"explanation":"Không nên tiêu hết ngay."},{"id":"u6-s2-q8","prompt":"Children ___ (thank) adults for their New Year wishes.","blanks":[{"accept":["should thank"]}],"explanation":"Lễ phép → should."}]},{"id":"u6-s3","type":"mcq","title":"Chọn some / any","level":2,"grammarPointId":"u6-some-any","items":[{"id":"u6-s3-q1","prompt":"There are ___ peach flowers in the living room.","options":["some","a","an","any"],"answerIndex":0,"explanation":"Câu khẳng định + N số nhiều → some."},{"id":"u6-s3-q2","prompt":"We don't have ___ fireworks at home.","options":["any","an","some","a"],"answerIndex":0,"explanation":"Câu phủ định → any."},{"id":"u6-s3-q3","prompt":"Are there ___ sweets on the table?","options":["an","some","any","a"],"answerIndex":2,"explanation":"Câu hỏi → any."},{"id":"u6-s3-q4","prompt":"There is ___ lucky money in these red envelopes.","options":["some","an","a","any"],"answerIndex":0,"explanation":"Khẳng định + N không đếm được → some."},{"id":"u6-s3-q5","prompt":"Do you have ___ relatives in Da Nang?","options":["any","some","an","a"],"answerIndex":0,"explanation":"Câu hỏi → any."},{"id":"u6-s3 ều → There are."},{"id":"u6-s7-q8","sentence":"You should being polite to older people.","tokens":["You","should","being","polite","to","older","people."],"errorStart":2,"errorEnd":2,"wrong":"being","fix":["be"],"corrected":["You should be polite to older people."],"explanation":"should + be."},{"id":"u6-s7-q9","sentence":"Should she to help her mother clean the house?","tokens":["Should","she","to","help","her","mother","clean","the","house?"],"errorStart":2,"errorEnd":3,"wrong":"to help","fix":["help"],"corrected":["Should she help her mother clean the house?"],"explanation":"Should + S + V nguyên mẫu."}]},{"id":"u6-s8","type":"rewrite","title":"Viết câu hoàn chỉnh từ từ gợi ý","level":4,"grammarPointId":"u6-some-any","items":[{"id":"u6-s8-q1","prompt":"children / should / behave / well / at Tet","accept":["Children should behave well at Tet."],"explanation":"S + should + V + adv."},{"id":"u6-s8-q2","prompt":"we / have / some / peach flowers / living room","accept":["We have some peach flowers in the living room."],"explanation":"Thêm in the."},{"id":"u6-s8-q3","prompt":"there / not be / any / fireworks / our house","accept":["There aren't any fireworks in our house."],"explanation":"Số nhiều, phủ định → There aren't any."},{"id":"u6-s8-q4","prompt":"should / we / visit / our grandparents / tomorrow / ?","accept":["Should we visit our grandparents tomorrow?"],"explanation":"Should + S + V?"},{"id":"u6-s8-q5","prompt":"do / you / have / any / relatives / Hue / ?","accept":["Do you have any relatives in Hue?"],"explanation":"Câu hỏi → any."},{"id":"u6-s8-q6","prompt":"Nam / should not / spend / all / lucky money","accept":["Nam shouldn't spend all his lucky money.","Nam shouldn't spend all of his lucky money."],"explanation":"shouldn't + V; thêm his."}]},{"id":"u6-s9","type":"cloze","title":"Hoàn thành đoạn văn (tổng hợp Unit 6)","level":5,"grammarPointId":"u6-some-any","items":[{"id":"u6-s9-q1","segments":[{"type":"text","text":"Tet is coming, and my family is very busy. We "},{"type":"blank","n":1,"mode":"select","options":["shouldn't","should"],"accept":["should"]},{"type":"text","text":" clean and decorate our house before the holiday. Mum buys "},{"type":"blank","n":2,"mode":"select","options":["any","some"],"accept":["some"]},{"type":"text","text":" peach flowers and prepares "},{"type":"blank","n":3,"mode":"select","options":["some","any"],"accept":["some"]},{"type":"text","text":" special food. We do not buy "},{"type":"blank","n":4,"mode":"select","options":["some","any"],"accept":["any"]},{"type":"text","text":" fireworks. My grandparents are coming to stay with us, so I "},{"type":"blank","n":5,"mode":"select","options":["shouldn't","should"],"accept":["should"]},{"type":"text","text":" help my parents prepare their room.\nOn the first day of Tet, children "},{"type":"blank","n":6,"mode":"select","options":["should","shouldn't"],"accept":["should"]},{"type":"text","text":" behave well and say \"Happy New Year\" to older people. We "},{"type":"blank","n":7,"mode":"select","options":["should","shouldn't"],"accept":["shouldn't"]},{"type":"text","text":" fight or break things. When my aunt gives me lucky money, I "},{"type":"blank","n":8,"mode":"select","options":["shouldn't","should"],"accept":["should"]},{"type":"text","text":" say thank you. There are "},{"type":"blank","n":9,"mode":"select","options":["any","some"],"accept":["some"]},{"type":"text","text":" sweets on the table, but I "},{"type":"blank","n":10,"mode":"select","options":["should","shouldn't"],"accept":["shouldn't"]},{"type":"text","text":" eat too many of them.\nIn the afternoon, we visit our relatives. \""},{"type":"blank","n":11,"mode":"select","options":["Do","Should"],"accept":["Should"]},{"type":"text","text":" we bring some fruit?\" I ask Mum. \"Yes, we "},{"type":"blank","n":12,"mode":"select","options":["shouldn't","should"],"accept":["should"]},{"type":"text","text":",\" she says. Before we leave, Dad asks, \"Are there "},{"type":"blank","n":13,"mode":"select","options":["some","any"],"accept":["any"]},{"type":"text","text":" presents for the children?\" Mum checks the bags and says, \"Yes, there are "},{"type":"blank","n":14,"mode":"select","options":["any","some"],"accept":["some"]},{"type":"text","text":".\" At night, everyone is tired, so we "},{"type":"blank","n":15,"mode":"select","options":["should","shouldn't"],"accept":["shouldn't"]},{"type":"text","text":" make too much noise."}],"blankCount":15}]}]},{"id":"u7","number":7,"title":"Television","titleVi":"Truyền hình","grammarPoints":[{"id":"u7-wh-questions","title":"Wh-questions","titleVi":"Câu hỏi có từ để hỏi","sections":[{"heading":"Từ để hỏi","blocks":[{"type":"formula","text":"What: sự vật / hoạt động → What is your favourite TV programme?"},{"type":"formula","text":"Who: người → Who watches TV with you?"},{"type":"formula","text":"Where: nơi chốn → Where do you watch TV?"},{"type":"formula","text":"When: thời gian → When does the programme start?"},{"type":"formula","text":"Why: lý do → Why do you like cartoons? – Because they are funny."},{"type":"formula","text":"How: cách thức → How do you watch this programme? – On my tablet."}]},{"heading":"Cụm từ để hỏi","blocks":[{"type":"formula","text":"How often: tần suất → Twice a week."},{"type":"formula","text":"How long: khoảng thời gian → Thirty minutes."},{"type":"formula","text":"How many + N số nhiều: số lượng → How many programmes do you watch?"},{"type":"formula","text":"What time / Which (channel): giờ cụ thể / lựa chọn"}]},{"heading":"Cấu trúc","blocks":[{"type":"formula","text":"Wh-word + be + S + ...? → Where is the remote control?"},{"type":"formula","text":"Wh-word + do/does/did + S + V nguyên mẫu? → What does Lan watch after dinner?"},{"type":"formula","text":"Who + V-s/es...? (Who làm chủ ngữ) → Who presents the weather forecast?"},{"type":"tip","text":"Nhìn câu trả lời để chọn đúng từ để hỏi trước khi chọn trợ động từ."},{"type":"mistake","wrong":"Why you like this programme?" s.","options":["Him","He","Hers","His"],"answerIndex":3,"explanation":"Tom (nam) → His."},{"id":"u9-s1-q3","prompt":"Lan is visiting Paris with ___ parents.","options":["hers","she","her","their"],"answerIndex":2,"explanation":"Lan (nữ) + danh từ → her."},{"id":"u9-s1-q4","prompt":"We are staying in Sydney. ___ hotel is near the Opera House.","options":["Our","Ours","Us","Their"],"answerIndex":0,"explanation":"We → Our."},{"id":"u9-s1-q5","prompt":"Mai and Nam are tourists. ___ guide is very friendly.","options":["Theirs","Their","Them","Our"],"answerIndex":1,"explanation":"Hai người → Their."},{"id":"u9-s1-q6","prompt":"The city is famous for ___ beautiful beaches.","options":["it's","it","their","its"],"answerIndex":3,"explanation":"\"của nó\" → its (không phải it's)."},{"id":"u9-s1-q7","prompt":"The children are carrying ___ own backpacks.","options":["theirs","their","them","our"],"answerIndex":1,"explanation":"The children → their + N."},{"id":"u9-s1-q8","prompt":"The museum has changed ___ opening hours.","options":["its","it's","their","his"],"answerIndex":0,"explanation":"The museum (vật số ít) → its."}]},{"id":"u9-s2","type":"mcq","title":"Chọn đại từ sở hữu đúng","level":2,"grammarPointId":"u9-possessive-pronouns","items":[{"id":"u9-s2-q1","prompt":"This city map belongs to me. It is ___.","options":["my","me","ours","mine"],"answerIndex":3,"explanation":"Đứng một mình → mine."},{"id":"u9-s2-q2","prompt":"That blue suitcase belongs to Lan. It is ___.","options":["her","she","hers","their"],"answerIndex":2,"explanation":"Lan → hers."},{"id":"u9-s2-q3","prompt":"These postcards belong to us. They are ___.","options":["our","ours","us","theirs"],"answerIndex":1,"explanation":"us → ours."},{"id":"u9-s2-q4","prompt":"Those tickets belong to Tom and Ben. They are ___.","options":["their","theirs","them","ours"],"answerIndex":1,"explanation":"Tom and Ben → theirs."},{"id":"u9-s2-q5","prompt":"Our room is on the third floor; ___ is on the fourth.","options":["thei her"]},{"type":"text","text":" phone. I used "},{"type":"blank","n":9,"mode":"input","accept":["my"]},{"type":"text","text":" camera instead.\nOn the second day, we met another Vietnamese family. Their children showed us "},{"type":"blank","n":10,"mode":"input","accept":["their"]},{"type":"text","text":" city map because we had left "},{"type":"blank","n":11,"mode":"input","accept":["ours"]},{"type":"text","text":" at the hotel. \"You can use this one,\" they said. \"It is "},{"type":"blank","n":12,"mode":"input","accept":["ours"]},{"type":"text","text":".\""}],"blankCount":12}]}]},{"id":"u10","number":10,"title":"Our Houses in the Future","titleVi":"Ngôi nhà tương lai","grammarPoints":[{"id":"u10-will","title":"Future Simple","titleVi":"Thì tương lai đơn","sections":[{"heading":"Cách dùng","blocks":[{"type":"rule","text":"Dự đoán, quyết định tức thời, lời hứa, sự việc sẽ xảy ra trong tương lai."},{"type":"example","en":"People will live in smarter houses.","vi":"Con người sẽ sống trong những ngôi nhà thông minh hơn."},{"type":"example","en":"I'll help you with the robot.","vi":"Mình sẽ giúp bạn với con robot."},{"type":"rule","text":"Dấu hiệu: tomorrow, next week/year, in the future, one day, soon, I think, I'm sure."}]},{"heading":"Cấu trúc","blocks":[{"type":"formula","text":"(+) S + will ('ll) + V nguyên mẫu"},{"type":"formula","text":"(–) S + will not (won't) + V nguyên mẫu"},{"type":"formula","text":"(?) Will + S + V...? → Yes, S + will. / No, S + won't."},{"type":"formula","text":"(Wh) Wh-word + will + S + V...? → Where will you live?"},{"type":"mistake","wrong":"She will lives in a smart house.","right":"She will live in a smart house."},{"type":"mistake","wrong":"He won't to use a dishwasher.","right":"He won't use a dishwasher."}]}]},{"id":"u10-might","title":"Might / Might not","titleVi":"Khả năng trong tương lai","sections":[{"heading":"Cách dùng & cấu trúc","blocks":[{"type":"formula","text":"might + V nguyên mẫu = có thể (nhưng chưa chắc) → My house might be on an island."},{"type":"formula","text":"might not + V nguyên mẫu = có thể không → We might not use ordinary TVs."},{"type":"rule","text":"might dùng giống nhau với mọi chủ ngữ, không thêm -s, không dùng \"to\"."}]},{"heading":"Will hay might?","blocks":[{"type":"formula","text":"will: người nói tin chắc / dự đoán khá chắc chắn"},{"type":"formula","text":"might: khả năng, không chắc chắn (perhaps, maybe, not sure, not decided)"},{"type":"example","en":"Robots will be common, but my family might not buy one soon.","vi":"Robot sẽ phổ biến, nhưng nhà tôi có thể chưa mua sớm."},{"type":"mistake","wrong":"My house might has a robot.","right":"My house might have a robot."},{"type":"mistake","wrong":"Perhaps people might will live on Mars.","right":"Perhaps people might live on Mars."}]}]}],"exerciseSets":[{"id":"u10-s1","type":"mcq","title":"Chọn will / won't đúng","level":1,"grammarPointId":"u10-will","items":[{"id":"u10-s1-q1","prompt":"I think homes ___ use more solar energy in the future.","options":["won't","did","are","will"],"answerIndex":3,"explanation":"Dự đoán (I think) → will."},{"id":"u10-s1-q2","prompt":"The robot is broken, so it ___ clean the floor today.","options":["will","won't","does","did"],"answerIndex":1,"explanation":"Robot hỏng → won't."},{"id":"u10-s1-q3","prompt":"Our new house ___ have a garden because there is no space.","options":["won't","will","is","does"],"answerIndex":0,"explanation":"Không có chỗ → won't."},{"id":"u10-s1-q4","prompt":"This old TV no longer works. We ___ use it in our future house.","options":["won't","will","do","did"],"answerIndex":0,"explanation":"TV hỏng → won't."},{"id":"u10-s1-q5","prompt":"I promise I ___ leave the lights on when nobody is home.","options":["will","do","won't","am"],"answerIndex":2,"explanation":"Lời hứa không để đèn → won't."},{"id":"u10-s1-q6","prompt":"People ___ need keys if doors recognise their faces.","options":["won't","will","did","are"],"answerIndex":0,"explanation":"Cửa nhận diện  / have / a robot? – Yes","accept":["Will your future house have a robot? Yes, it will."],"explanation":"Will + S + V? → Yes, it will."},{"id":"u10-s3-q2","prompt":"people / live / underwater? – No","accept":["Will people live underwater? No, they won't."],"explanation":"No, they won't."},{"id":"u10-s3-q3","prompt":"the robot / cook / meals? – No","accept":["Will the robot cook meals? No, it won't."],"explanation":"the robot → it."},{"id":"u10-s3-q4","prompt":"where / you / live / in the future?","accept":["Where will you live in the future?"],"explanation":"Wh + will + S + V?"},{"id":"u10-s3-q5","prompt":"how many rooms / your future house / have?","accept":["How many rooms will your future house have?"],"explanation":"How many + N + will + S + V?"}]},{"id":"u10-s4","type":"reorder","title":"Sắp xếp từ thành câu tương lai","level":3,"grammarPointId":"u10-will","items":[{"id":"u10-s4-q1","tokens":["a smart kitchen","my future house","have","will"],"endPunct":".","accept":["My future house will have a smart kitchen."],"explanation":"S + will + V + O."},{"id":"u10-s4-q2","tokens":["won't","people","use","so much plastic"],"endPunct":".","accept":["People won't use so much plastic."],"explanation":"S + won't + V."},{"id":"u10-s4-q3","tokens":["solar panels","your house","will","have"],"endPunct":"?","accept":["Will your house have solar panels?"],"explanation":"Will + S + V?"},{"id":"u10-s4-q4","tokens":["in the future","where","live","will","you"],"endPunct":"?","accept":["Where will you live in the future?"],"explanation":"Wh + will + S + V?"},{"id":"u10-s4-q5","tokens":["do","your robot","what","will"],"endPunct":"?","accept":["What will your robot do?"],"explanation":"What + will + S + do?"},{"id":"u10-s4-q6","tokens":["ordinary keys","need","we","won't"],"endPunct":".","accept":["We won't need ordinary keys."],"explanation":"S + won't + V."},{"id":"u10-s4-q7","tokens":["next year","a new fridge","buy","will","my parents"],"endPunct":".","accept":["My parents will const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};

const CONTR = [[/\bwon't\b/g,"will not"],[/\bcan't\b/g,"cannot"],[/\bshan't\b/g,"shall not"],[/\b(\w+)n't\b/g,"$1 not"],[/\bi'm\b/g,"i am"],[/\b(\w+)'re\b/g,"$1 are"],[/\b(\w+)'ll\b/g,"$1 will"],[/\b(i|you|we|they)'ve\b/g,"$1 have"],[/\b(he|she|it|that|there|what|where|who|here)'s\b/g,"$1 is"],[/\bcan not\b/g,"cannot"]];
function norm(s){ s=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"'); for(const [r,t] of CONTR) s=s.replace(r,t); return s.replace(/\s[–—-]\s/g," ").replace(/[.,!?;:"()–—]/g," ").replace(/\s+/g," ").trim(); }
const match = (a, acc) => acc.some(x => norm(x) === norm(a));

let store = { best: {}, mistakes: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) store = Object.assign(store, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} updateBadge(); };
const updateBadge = () => { $("#mcount").textContent = Object.keys(store.mistakes).length; };

const index = {}; // itemId -> {unit,set,item}
for (const u of DATA.units) for (const s of u.exerciseSets) for (const it of s.items) index[it.id] = { u, s, it };

/* ---------- TTS cho ví dụ ---------- */
function speak(t){ try{ const ut = new SpeechSynthesisUtterance(t); ut.lang="en-GB"; ut.rate=.92; speechSynthesis.cancel(); speechSynthesis.speak(ut);}catch(e){} }
const ICON_SAY = () => { const s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("width","16"); s.setAttribute("height","16"); s.innerHTML='<path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>'; return s; };

const app = $("#app");
const view = (...els) => { app.replaceChildren(...els); window.scrollTo(0, 0); };
const stars = n => "★".repeat(n) + "☆".repeat(5 - n);

function unitProgress(u){ const done = u.exerciseSets.filter(s => (store.best[s.id] ?? 0) >= .8).length; return done / u.exerciseSets.length; }

/* ================= TRANG CHỦ ================= */
function home(){
  const totalSets = DATA.units.reduce((a,u)=>a+u.exerciseSets.length,0);
  const done = DATA.units.reduce((a,u)=>a+u.exerciseSets.filter(s=>(store.best[s.id]??0)>=.8).length,0);
  view(
    h("div",{class:"hero"},
      h("span",{class:"eyebrow"},"Global Success · Học kì 1 & 2"),
      h("h1",{},"Chọn Unit để học ngữ pháp"),
      h("p",{class:"muted"},`Mỗi Unit gồm lý thuyết và các bộ bài luyện tập. Đạt từ 80% là hoàn thành bộ bài. Đã hoàn thành ${done}/${totalSets} bộ.`)),
    h("div",{class:"units"}, DATA.units.map(u => {
      const p = unitProgress(u);
      return h("button",{class:"ucard",onclick:()=>unitView(u)},
        h("span",{class:"num"}, String(u.number).padStart(2,"0")),
        h("span",{class:"t"}, u.title),
        h("span",{class:"g"}, u.grammarPoints.map(g=>g.title).join(" · ")),
        h("div",{class:"bar","aria-label":`Tiến độ ${Math.round(p*100)}%`}, h("i",{style:`width:${p*100}%`})));
    })));
}

/* ================= UNIT ================= */
function unitView(u, tab = "theory"){
  const tabs = h("div",{class:"tabs",role:"tablist"},
    h("button",{role:"tab","aria-selected":tab==="theory",onclick:()=>unitView(u,"theory")},"Lý thuyết"),
    h("button",{role:"tab","aria-selected":tab==="practice",onclick:()=>unitView(u,"practice")},`Luyện tập (${u.exerciseSets.length})`));
  const body = tab === "theory" ? theory(u) : practice(u);
  view(h("button",{class:"back",onclick:home},"← Tất cả Unit"),
    h("div",{class:"hero",style:"margin-top:10px"}, h("span",{class:"eyebrow"},`Unit ${u.number}`), h("h1",{},u.title), h("p",{class:"muted"},u.titleVi)),
    tabs, body);
}
function theory(u, only){
  return h("div",{class:"stack"}, u.grammarPoints.filter(g=>!only||g.id===only).map(g =>
    h("article",{class:"sheet gp",id:g.id},
      h("header",{}, h("h2",{},g.titleVi), h("span",{class:"muted"},g.title)),
      g.sections.map(sec => h("section",{class:"sec"}, h("h4",{},sec.heading),
        h("div",{class:"blocks"}, sec.blocks.map(block))))
    )),
    only ? null : h("button",{class:"btn primary",onclick:()=>unitView(u,"practice")},"Luyện tập ngay"));
}
function block(b){
  if (b.type==="rule") return h("div",{class:"rule"},b.text);
  if (b.type==="formula") return h("div",{class:"formula"},b.text);
  if (b.type==="tip") return h("div",{}, h("span",{class:"tip"},b.text));
  if (b.type==="example") return h("div",{class:"example"},
    h("button",{class:"say","aria-label":"Nghe câu ví dụ",onclick:()=>speak(b.en)},ICON_SAY()),
    h("div",{}, h("div",{class:"en"},b.en), b.vi ? h("div",{class:"vi"},b.vi) : null));
  if (b.type==="mistake") return h("div",{class:"mistake"}, h("span",{class:"x"},"✗"), h("s",{},b.wrong), h("span",{class:"v"},"✓"), h("span",{},b.right));
}
function practice(u){
  return h("div",{class:"stack"},
    h("div",{class:"sets"}, u.exerciseSets.map(s => {
      const best = store.best[s.id];
      const n = s.type === "cloze" ? s.items[0].blankCount : s.items.length;
      return h("button",{class:"set",onclick:()=>play(s.items.map(it=>it.id), {title:s.title, back:()=>unitView(u,"practice"), setId:s.id})},
        h("div",{class:"meta"}, h("span",{class:"ttl"},s.title),
          h("div",{class:"row",style:"gap:8px"}, h("span",{class:"chip"},TYPE_VI[s.type]), h("span",{class:"stars","aria-label":`Độ khó ${s.level}/5`},stars(s.level)), h("span",{class:"muted",style:"font-size:.8rem"},`${n} câu`))),
        h("span",{class:"score"+(best>=.8?" done":"")}, best==null ? "—" : Math.round(best*100)+"%"));
    })),
    h("button",{class:"btn",onclick:()=>{
      const pool = u.exerciseSets.filter(s=>s.type!=="cloze").flatMap(s=>s.items.map(i=>i.id));
      play(shuffle(pool).slice(0,12), {title:`Kiểm tra nhanh Unit ${u.number}`, back:()=>unitView(u,"practice")});
    }},"Kiểm tra nhanh: 12 câu ngẫu nhiên"));
}
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ================= SỔ LỖI SAI ================= */
function mistakesView(){
  const ids = Object.keys(store.mistakes).filter(id=>index[id]);
  view(h("button",{class:"back",onclick:home},"← Tất cả Unit"),
    h("div",{class:"hero",style:"margin-top:10px"}, h("span",{class:"eyebrow"},"Ôn tập"), h("h1",{},"Sổ lỗi sai"),
      h("p",{class:"muted"},"Những câu em làm sai sẽ được ghi lại ở đây. Làm đúng khi luyện lại thì câu đó tự xoá khỏi sổ.")),
    ids.length ? h("div",{class:"stack"},
      h("button",{class:"btn primary",onclick:()=>play(shuffle(ids).slice(0,15),{title:"Luyện lại câu sai",back:mistakesView})},`Luyện lại ${Math.min(ids.length,15)} câu`),
      h("div",{class:"review"}, ids.map(id=>{ const {u,s}=index[id]; return h("div",{class:"r"}, h("div",{class:"eyebrow"},`Unit ${u.number} · ${TYPE_VI[s.type]}`), h("div",{},preview(index[id]))); })))
    : h("div",{class:"sheet empty"},"Chưa có câu sai nào. Hãy vào một Unit và luyện tập nhé!"));
}
function preview({s,it}){
  if (s.type==="reorder") return it.tokens.join(" / ");
  if (s.type==="error") return it.sentence;
  if (s.type==="classify") return it.text;
  if (s.type==="cloze") return s.title;
  return it.prompt;
}

/* ================= TRÌNH LÀM BÀI ================= */
function play(ids, opts){
  let i = 0, total = 0; const results = [];
  const next = () => { if (i >= ids.length) return finish(); renderItem(ids[i]); };
  function finish(){
    const sc = total / ids.length;
    if (opts.setId){ store.best[opts.setId] = Math.max(store.best[opts.setId] ?? 0, sc); save(); }
    const wrong = results.filter(r=>!r.ok);
    view(h("div",{class:"sheet sum"},
      h("span",{class:"eyebrow"},opts.title),
      h("div",{class:"big"},`${Math.round(sc*100)}%`),
      h("p",{class:"muted"}, sc>=.8 ? "Rất tốt! Em đã hoàn thành bộ bài này." : "Cố lên! Xem lại lý thuyết rồi làm lại để đạt từ 80%."),
      wrong.length ? h("div",{class:"review"}, h("h3",{},"Câu cần xem lại"), wrong.map(r=>h("div",{class:"r"}, h("div",{},preview(index[r.id])), h("div",{style:"color:var(--ok);font-weight:600"},"→ "+r.expected)))) : null,
      h("div",{class:"row",style:"justify-content:center"},
        h("button",{class:"btn",onclick:opts.back},"Quay lại"),
        h("button",{class:"btn primary",onclick:()=>play(ids,opts)},"Làm lại"))));
  }
  function renderItem(id){
    const {u,s,it} = index[id];
    const box = h("div",{class:"player"});
    const fbSlot = h("div");
    const checkBtn = h("button",{class:"btn primary",disabled:true},"Kiểm tra");
    let getAnswer = null;
    const ready = (on=true) => checkBtn.disabled = !on;
    const done = (ok, part, expected) => {
      total += part; results.push({id, ok, expected});
      if (ok) delete store.mistakes[id]; else store.mistakes[id] = 1;
      save();
      checkBtn.remove();
      const gpLink = h("button",{class:"back",onclick:()=>{ view(h("button",{class:"back",onclick:()=>renderItemAgain()},"← Quay lại bài đang làm"), theory(u,s.grammarPointId)); }},"Xem lại lý thuyết");
      fbSlot.replaceChildren(h("div",{class:"fb "+(ok?"ok":"bad")},
        h("span",{class:"h"}, ok ? "Chính xác!" : (part>0 ? `Đúng một phần (${Math.round(part*100)}%)` : "Chưa đúng")),
        ok ? null : h("span",{class:"ans"},"Đáp án: "+expected),
        it.explanation ? h("span",{},it.explanation) : null,
        h("div",{class:"row",style:"justify-content:space-between;margin-top:4px"}, ok?h("span"):gpLink,
          h("button",{class:"btn primary",onclick:()=>{i++;next();}}, i+1<ids.length ? "Câu tiếp theo" : "Xem kết quả"))));
      fbSlot.querySelector(".btn.primary").focus();
    };
    let snapshot = null; const renderItemAgain = () => { view(snapshot); };
    checkBtn.onclick = () => getAnswer && getAnswer();

    const head = h("div",{class:"ptop"},
      h("button",{class:"back",onclick:opts.back},"✕ Thoát"),
      h("div",{class:"bar"}, h("i",{style:`width:${(i)/ids.length*100}%;background:var(--cobalt)`})),
      h("span",{class:"muted",style:"font-family:var(--f-mono);font-size:.85rem"},`${i+1}/${ids.length}`));
    box.append(head, h("div",{class:"row"}, h("span",{class:"chip"},TYPE_VI[s.type]), h("span",{class:"muted",style:"font-size:.88rem"},s.title)));
    if (s.instruction) box.append(h("div",{class:"instr"},s.instruction.replace(/ \| /g,"\n")));

    const T = s.type;
    if (T==="mcq"){
      box.append(h("div",{class:"q"},withBlank(it.prompt)));
      const grid = h("div",{class:"opts"}, it.options.map((o,k)=>h("button",{class:"opt",onclick:()=>{
        [...grid.children].forEach(b=>b.disabled=true);
        const ok = k===it.answerIndex; grid.children[it.answerIndex].classList.add("ok"); if(!ok) grid.children[k].classList.add("bad");
        done(ok, ok?1:0, it.options[it.answerIndex]);
      }}, h("span",{class:"k"},"ABCD"[k]||"•"), o)));
      box.append(grid, fbSlot);
    }
    else if (T==="classify"){
      box.append(h("div",{class:"q"}, h("strong",{style:"font-size:1.4rem"},it.text))); if(it.context) box.append(h("div",{class:"muted"},it.context));
      const grid = h("div",{class:"cats"}, s.categories.map(c=>h("button",{class:"cat",onclick:(e)=>{
        [...grid.children].forEach(b=>b.disabled=true); const ok=c===it.category;
        [...grid.children].find(b=>b.textContent===it.category).classList.add("ok"); if(!ok) e.currentTarget.classList.add("bad");
        done(ok, ok?1:0, it.category);
      }},c)));
      box.append(grid, fbSlot);
    }
    else if (T==="gap"){
      const inputs=[]; const parts = it.prompt.split("___");
      const q = h("div",{class:"q"}); parts.forEach((p,k)=>{ q.append(p); if(k<parts.length-1){ const inp=h("input",{class:"inl",id:`${it.id}-b${k}`,autocomplete:"off",autocapitalize:"off",spellcheck:"false","aria-label":`Chỗ trống ${k+1}`,oninput:()=>ready(inputs.every(x=>x.value.trim())),onkeydown:e=>{if(e.key==="Enter"&&!checkBtn.disabled)checkBtn.click();}}); inputs.push(inp); q.append(inp);} });
      getAnswer = () => { const p = it.blanks.map((b,k)=>match(inputs[k].value,b.accept)); inputs.forEach((x,k)=>{x.classList.add(p[k]?"ok":"bad"); x.readOnly=true;}); const part=p.filter(Boolean).length/p.length; done(part===1,part,it.blanks.map(b=>b.accept[0]).join(" / ")); };
      box.append(q, checkBtn, fbSlot); setTimeout(()=>inputs[0]?.focus(),0);
    }
    else if (T==="rewrite"){
      const ta = h("textarea",{class:"full",id:`${it.id}-t`,rows:"2",placeholder:"Viết câu trả lời của em…",autocapitalize:"sentences",spellcheck:"false",oninput:()=>ready(ta.value.trim().length>0),onkeydown:e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!checkBtn.disabled)checkBtn.click();}}});
      box.append(h("div",{class:"q"},it.prompt), ta, checkBtn, fbSlot);
      getAnswer = () => { ta.readOnly=true; const ok=match(ta.value,it.accept); done(ok,ok?1:0,it.accept[0]); };
      setTimeout(()=>ta.focus(),0);
    }
    else if (T==="reorder"){
      const ans = h("div",{class:"tray answer","aria-label":"Câu của em"}); const bank = h("div",{class:"tray","aria-label":"Thẻ từ"});
      const order=[];
      const sh = shuffle(it.tokens.map((t,k)=>({t,k}))); if (sh.every((x,k)=>x.k===k) && sh.length>1) sh.reverse();
      sh.forEach(({t})=>{ const b=h("button",{class:"tok",onclick:()=>{ if(b.classList.contains("used"))return; b.classList.add("used"); const a=h("button",{class:"tok",onclick:()=>{a.remove(); b.classList.remove("used"); order.splice(order.indexOf(t),1); ready(order.length===it.tokens.length);}},t); order.push(t); ans.append(a); ready(order.length===it.tokens.length);}},t); bank.append(b); });
      getAnswer = () => { const said=[...ans.children].map(x=>x.textContent); [...ans.children,...bank.children].forEach(x=>x.disabled=true); const ok=match(said.join(" "),it.accept); done(ok,ok?1:0,it.accept[0]); };
      box.append(h("div",{class:"muted",style:"font-size:.88rem"},"Chạm vào thẻ từ theo đúng thứ tự. Chạm lại thẻ ở trên để bỏ."), ans, bank, checkBtn, fbSlot);
    }
    else if (T==="error"){
      let tapped=-1; const fix = h("input",{class:"full",id:`${it.id}-f`,placeholder:"Sửa thành…",autocomplete:"off",autocapitalize:"off",spellcheck:"false",disabled:true,oninput:()=>ready(tapped>=0&&fix.value.trim()),onkeydown:e=>{if(e.key==="Enter"&&!checkBtn.disabled)checkBtn.click();}});
      const words = h("div",{class:"words"}, it.tokens.map((t,k)=>h("button",{class:"word",onclick:(e)=>{ [...words.children].forEach(w=>w.classList.remove("sel")); e.currentTarget.classList.add("sel"); tapped=k; fix.disabled=false; fix.focus(); ready(fix.value.trim()); }},t)));
      getAnswer = () => { const located = tapped>=it.errorStart && tapped<=it.errorEnd; const fixed = match(fix.value,it.fix)||match(fix.value,it.corrected);
        [...words.children].forEach((w,k)=>{w.disabled=true; if(k>=it.errorStart&&k<=it.errorEnd) w.classList.add("err");}); fix.readOnly=true;
        const part=(located?.5:0)+(fixed?.5:0); done(located&&fixed, part, `${it.wrong} → ${it.fix[0]}  (${it.corrected[0]})`); };
      box.append(h("div",{class:"muted",style:"font-size:.88rem"},"Bước 1: chạm vào từ sai. Bước 2: gõ cách sửa."), words, fix, checkBtn, fbSlot);
    }
    else if (T==="cloze"){
      const fields={}; const wrap=h("div",{class:"cloze sheet"}); let p=h("p"); wrap.append(p);
      const allFilled = () => Object.values(fields).every(f=>f.value.trim());
      for (const seg of it.segments){
        if (seg.type==="text"){ const lines=seg.text.split("\n"); lines.forEach((ln,k)=>{ if(k>0){p=h("p");wrap.append(p);} if(ln) p.append(ln); }); }
        else { p.append(h("span",{class:"n"},`(${seg.n})`));
          const f = seg.mode==="select"
            ? h("select",{class:"inl",id:`${it.id}-${seg.n}`,"aria-label":`Chỗ trống ${seg.n}`,onchange:()=>ready(allFilled())}, h("option",{value:""},"…"), seg.options.map(o=>h("option",{value:o},o)))
            : h("input",{class:"inl",id:`${it.id}-${seg.n}`,"aria-label":`Chỗ trống ${seg.n}`,autocomplete:"off",autocapitalize:"off",spellcheck:"false",oninput:()=>ready(allFilled())});
          fields[seg.n]=f; p.append(f); }
      }
      getAnswer = () => { const blanks=it.segments.filter(x=>x.type==="blank"); const res=blanks.map(b=>{const ok=match(fields[b.n].value,b.accept); fields[b.n].classList.add(ok?"ok":"bad"); fields[b.n].disabled=true; return ok;});
        const part=res.filter(Boolean).length/res.length; done(part===1,part,blanks.filter((b,k)=>!res[k]).map(b=>`(${b.n}) ${b.accept[0]}`).join("  ")); };
      box.append(wrap, h("div",{class:"muted",style:"font-size:.85rem"},"Ô chọn: chọn từ đúng. Ô trống: viết dạng đúng của từ trong ngoặc."), checkBtn, fbSlot);
    }
    snapshot = box; view(box);
  }
  next();
}
function withBlank(text){ const parts=text.split("___"); const out=[]; parts.forEach((p,k)=>{out.push(p); if(k<parts.length-1) out.push(h("span",{class:"blank"}," "));}); return out; }

$("#go-home").onclick = home; $("#go-mistakes").onclick = mistakesView;
updateBadge(); home();
</script>
